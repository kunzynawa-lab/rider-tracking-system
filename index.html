<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام متابعة المناديب</title>
  <meta name="theme-color" content="#101827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- خطوط عربي / أردو / بنغالي (لو الخط ما اتحملش يشتغل خط الجهاز) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101827;
      --card: #1d293b;
      --line: #475569;
      --text: #ffffff;
      --muted: #cbd5e1;
      --green: #16a34a;
      --red: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Noto Sans Arabic", "Noto Sans Bengali", "Segoe UI", Tahoma, Arial, sans-serif;
    }
    /* خطوط خاصة بكل لغة */
    html[lang="ar"] body { font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif; }
    html[lang="ur"] body { font-family: "Noto Nastaliq Urdu", "Noto Sans Arabic", "Jameel Noori Nastaleeq", Tahoma, serif; }
    html[lang="bn"] body { font-family: "Noto Sans Bengali", "Kalpurush", "Nirmala UI", "Vrinda", sans-serif; }

    main {
      width: min(100%, 420px);
      padding: 24px;
      background: var(--card);
      border-radius: 18px;
    }
    h1 { font-size: 25px; margin: 8px 0 0; line-height: 1.6; }
    p { color: var(--muted); line-height: 1.9; margin: 8px 0; }
    label { display: block; margin-top: 18px; color: var(--muted); line-height: 1.9; }

    /* الأردو (نستعليق) يحتاج ارتفاع سطر أكبر */
    html[lang="ur"] h1 { line-height: 2.1; }
    html[lang="ur"] p,
    html[lang="ur"] label,
    html[lang="ur"] button,
    html[lang="ur"] select { line-height: 2.3; }
    html[lang="bn"] p, html[lang="bn"] label { line-height: 1.8; }

    .lang-row { display: flex; align-items: center; gap: 10px; }
    .lang-row label { margin: 0; white-space: nowrap; }
    select, input, button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }
    select {
      margin-top: 0;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
    }
    input {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      /* الأرقام دايمًا من الشمال لليمين حتى في العربي والأردو */
      direction: ltr;
      text-align: start;
      unicode-bidi: plaintext;
    }
    html[dir="rtl"] input { text-align: right; }
    input::placeholder { color: #64748b; }
    button {
      border: 0;
      background: var(--green);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    button:active { transform: scale(0.98); }
    :focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
    #message { margin-top: 16px; min-height: 1.9em; }
    #message.error { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <div class="lang-row">
      <label for="lang" id="t-language">اللغة</label>
      <select id="lang" aria-label="Language">
        <option value="ar">العربية</option>
        <option value="ur">اردو</option>
        <option value="bn">বাংলা</option>
      </select>
    </div>

    <h1 id="t-title"></h1>
    <p id="t-welcome"></p>

    <label for="riderId" id="t-label"></label>
    <input id="riderId" type="text" inputmode="numeric" autocomplete="off" dir="ltr">
    <button id="loginBtn" type="button"></button>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const I18N = {
      ar: {
        dir: "rtl",
        language: "اللغة",
        title: "متابعة المناديب",
        pageTitle: "نظام متابعة المناديب",
        welcome: "أهلًا بك في نظام متابعة الطلبات. سنجهّز تسجيل الدخول والإشعارات في الخطوات التالية.",
        label: "رقم المندوب (ID)",
        placeholder: "اكتب رقم المندوب",
        button: "دخول",
        demo: "النسخة التجريبية — لم يتم التحقق من الهوية بعد.",
        empty: "من فضلك اكتب رقم المندوب.",
        received: "تم استلام الرقم {id}. تسجيل الدخول الفعلي سيتم تفعيله بعد إعداد قاعدة البيانات."
      },
      ur: {
        dir: "rtl",
        language: "زبان",
        title: "رائیڈر ٹریکنگ",
        pageTitle: "رائیڈرز کی نگرانی کا نظام",
        welcome: "آرڈرز کی نگرانی کے نظام میں خوش آمدید۔ لاگ اِن اور نوٹیفکیشن اگلے مراحل میں تیار کیے جائیں گے۔",
        label: "رائیڈر نمبر (ID)",
        placeholder: "اپنا رائیڈر نمبر لکھیں",
        button: "داخل ہوں",
        demo: "آزمائشی ورژن — شناخت کی تصدیق ابھی نہیں ہوئی۔",
        empty: "براہِ کرم رائیڈر نمبر لکھیں۔",
        received: "نمبر {id} موصول ہو گیا۔ اصل لاگ اِن ڈیٹابیس تیار ہونے کے بعد فعال ہو گا۔"
      },
      bn: {
        dir: "ltr",
        language: "ভাষা",
        title: "রাইডার ট্র্যাকিং",
        pageTitle: "রাইডার ট্র্যাকিং সিস্টেম",
        welcome: "অর্ডার ট্র্যাকিং সিস্টেমে স্বাগতম। লগইন ও নোটিফিকেশন পরবর্তী ধাপে চালু করা হবে।",
        label: "রাইডার নম্বর (ID)",
        placeholder: "আপনার রাইডার নম্বর লিখুন",
        button: "প্রবেশ করুন",
        demo: "পরীক্ষামূলক সংস্করণ — পরিচয় এখনো যাচাই করা হয়নি।",
        empty: "অনুগ্রহ করে রাইডার নম্বর লিখুন।",
        received: "নম্বর {id} পাওয়া গেছে। ডাটাবেস সেটআপের পর আসল লগইন চালু হবে।"
      }
    };

    const $ = (id) => document.getElementById(id);
    const msg = $("message");
    let lang = "ar";
    let lastState = "demo"; // demo | empty | received
    let lastId = "";

    // تحويل الأرقام العربية/الأردية/البنغالية إلى أرقام إنجليزية
    function normalizeDigits(str) {
      return str
        .replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x0660)
        .replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x06F0)
        .replace(/[০-৯]/g, (d) => d.charCodeAt(0) - 0x09E6);
    }

    function render() {
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.title = t.pageTitle;
      $("t-language").textContent = t.language;
      $("t-title").textContent = t.title;
      $("t-welcome").textContent = t.welcome;
      $("t-label").textContent = t.label;
      $("riderId").placeholder = t.placeholder;
      $("loginBtn").textContent = t.button;

      if (lastState === "empty") {
        msg.textContent = t.empty;
        msg.className = "error";
      } else if (lastState === "received") {
        msg.textContent = t.received.replace("{id}", lastId);
        msg.className = "";
      } else {
        msg.textContent = t.demo;
        msg.className = "";
      }
    }

    function setLang(l) {
      if (!I18N[l]) l = "ar";
      lang = l;
      $("lang").value = l;
      try { localStorage.setItem("lang", l); } catch (e) {}
      render();
    }

    function detectLang() {
      try {
        const saved = localStorage.getItem("lang");
        if (saved && I18N[saved]) return saved;
      } catch (e) {}
      const nav = (navigator.language || "ar").slice(0, 2).toLowerCase();
      return I18N[nav] ? nav : "ar";
    }

    $("lang").addEventListener("change", (e) => setLang(e.target.value));

    function login() {
      const id = normalizeDigits($("riderId").value.trim());
      if (!id) {
        lastState = "empty";
      } else {
        lastState = "received";
        lastId = id;
      }
      render();
    }

    $("loginBtn").addEventListener("click", login);
    $("riderId").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    setLang(detectLang());

    // تسجيل الـ Service Worker (للتثبيت كتطبيق ولاحقًا للإشعارات)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
