<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rider Tracking</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --text: #0f1b2d;
      --muted: #5b6b7f;
      --line: #e2e8ef;
      --brand: #0f766e;
      --brand-d: #0b5d57;
      --brand-soft: #e3f4f2;
      --amber: #b45309; --amber-soft: #fef3c7;
      --violet: #6d28d9; --violet-soft: #ede9fe;
      --blue: #1d4ed8; --blue-soft: #dbeafe;
      --green: #15803d; --green-soft: #dcfce7;
      --red: #b42318; --red-soft: #fee4e2;
      --shadow: 0 1px 2px rgba(15,27,45,.06), 0 8px 24px rgba(15,27,45,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --surface: #141d2e; --text: #eef2f7; --muted: #9aa9bd; --line: #243249;
        --brand: #2dd4bf; --brand-d: #14b8a6; --brand-soft: #0f2e2e;
        --amber: #fbbf24; --amber-soft: #3a2a08;
        --violet: #a78bfa; --violet-soft: #271f47;
        --blue: #60a5fa; --blue-soft: #14284d;
        --green: #4ade80; --green-soft: #0f2f1c;
        --red: #f87171; --red-soft: #3a1514;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--text);
      font-family: "Noto Sans Arabic", "Noto Sans Bengali", Inter, system-ui, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.55; font-size: 16px;
    }
    .hidden { display: none !important; }
    p { margin: 0; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

    .appbar {
      position: sticky; top: 0; z-index: 5;
      background: var(--brand); color: #fff;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    @media (prefers-color-scheme: dark) { .appbar { background: #0f2e2e; } }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; background: #fff; }
    .langs { display: flex; gap: 4px; background: rgba(255,255,255,.16); padding: 3px; border-radius: 999px; }
    .langs button {
      border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; font-weight: 600;
      padding: 5px 11px; border-radius: 999px; cursor: pointer; min-height: 30px;
    }
    .langs button[aria-pressed="true"] { background: #fff; color: #0b5d57; }
    @media (prefers-color-scheme: dark) { .langs button[aria-pressed="true"] { background: #2dd4bf; color: #04201d; } }

    main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; }
    h1 { font-size: 24px; margin: 0 0 6px; line-height: 1.3; }
    h2 { font-size: 20px; margin: 0; line-height: 1.35; }
    .muted { color: var(--muted); }

    /* login */
    .hero { text-align: center; padding: 28px 8px 20px; }
    .hero img { width: 72px; height: 72px; border-radius: 20px; box-shadow: var(--shadow); }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 15px; }
    input[type=text] {
      width: 100%; padding: 15px 16px; font: inherit; font-size: 20px; letter-spacing: .5px;
      border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text);
      text-align: center; direction: ltr;
    }
    input[type=text]:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 4px var(--brand-soft); }
    button.btn {
      width: 100%; min-height: 56px; padding: 14px 18px; border: 0; border-radius: 14px; cursor: pointer;
      font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: var(--brand-d);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    @media (prefers-color-scheme: dark) { button.btn { color: #04201d; background: var(--brand); } }
    button.btn:active { transform: scale(.985); }
    button.btn:disabled { opacity: .55; cursor: default; }
    .btn.amber { background: #d97706; color: #fff; }
    .btn.violet { background: #6d28d9; color: #fff; }
    .btn.blue { background: #1d4ed8; color: #fff; }
    .btn.green { background: #15803d; color: #fff; }
    .btn.quiet { background: var(--bg); color: var(--text); border: 1px solid var(--line); min-height: 50px; font-size: 16px; font-weight: 600; }
    .btn.danger { background: transparent; color: var(--red); border: 1px solid var(--line); min-height: 46px; font-size: 15px; font-weight: 600; }
    .stack > * + * { margin-top: 12px; }

    /* hello */
    .hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 14px; }
    .hello .id { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; direction: ltr; }

    /* ask banner */
    .ask {
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;
      background: var(--amber-soft); border: 1.5px solid var(--amber); color: var(--text);
      border-radius: 16px; padding: 14px 16px; font-weight: 700;
    }
    .ask.late { background: var(--red-soft); border-color: var(--red); }
    .ask .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); margin-top: 7px; flex: none; animation: pulse 1.4s infinite; }
    .ask.late .dot { background: var(--red); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217,119,6,.5);} 100% { box-shadow: 0 0 0 12px rgba(217,119,6,0);} }
    @media (prefers-reduced-motion: reduce) { .ask .dot { animation: none; } }

    /* status */
    .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 10px; }
    .b-idle { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .b-declared { background: var(--amber-soft); color: var(--amber); }
    .b-arrived { background: var(--violet-soft); color: var(--violet); }
    .b-picked_up { background: var(--blue-soft); color: var(--blue); }

    /* stepper */
    .stepper { list-style: none; margin: 18px 0 0; padding: 0; }
    .stepper li { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--muted); }
    .stepper li .n {
      width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
      font-size: 13px; font-weight: 700; background: var(--bg); border: 2px solid var(--line); color: var(--muted);
    }
    .stepper li:not(:last-child)::after {
      content: ""; position: absolute; width: 2px; height: 18px; background: var(--line);
      inset-inline-start: 13px; top: 36px;
    }
    .stepper li.done { color: var(--text); }
    .stepper li.done .n { background: var(--brand-d); border-color: var(--brand-d); color: #fff; }
    @media (prefers-color-scheme: dark) { .stepper li.done .n { background: var(--brand); border-color: var(--brand); color: #04201d; } }
    .stepper li.now { color: var(--text); font-weight: 700; }
    .stepper li.now .n { border-color: var(--brand); color: var(--brand-d); background: var(--brand-soft); }
    .stepper .t { margin-inline-start: auto; font-size: 13px; font-weight: 600; direction: ltr; color: var(--muted); }

    .note { margin-top: 14px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; }

    /* sticky action bar */
    .dock {
      position: fixed; inset-inline: 0; bottom: 0; z-index: 6;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
    }
    .dock .in { max-width: 480px; margin: 0 auto; }
    .dock .row { display: grid; gap: 10px; }
    .dock .row.two { grid-template-columns: 1fr 1fr; }

    /* settings */
    details { margin-top: 16px; }
    summary { list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▾"; color: var(--muted); }
    details[open] summary::after { content: "▴"; }
    details .body { padding: 0 18px 18px; }
    .setting { padding-top: 14px; }
    .setting + .setting { border-top: 1px solid var(--line); margin-top: 14px; }
    .setting p { margin-bottom: 10px; font-size: 15px; }

    #message {
      position: fixed; inset-inline: 16px; top: calc(env(safe-area-inset-top) + 64px); z-index: 8;
      max-width: 448px; margin: 0 auto; background: #0f1b2d; color: #fff; padding: 12px 16px; border-radius: 12px;
      font-size: 14.5px; box-shadow: var(--shadow); text-align: center;
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand"><img src="/icon-192.png" alt=""><span id="appName"></span></div>

      <button type="button" data-lang="ur" aria-pressed="false">اردو</button>
      <button type="button" data-lang="bn" aria-pressed="false">বাংলা</button>
    </div>
  </header>

  <main>
    <section id="loginView" class="hidden">
      <div class="hero">
        <img src="/icon-192.png" alt="">
        <h1 id="loginTitle" style="margin-top:14px"></h1>
        <p class="muted" id="loginSub"></p>
      </div>
      <div class="card stack">
        <div>
          <label for="riderId" id="idLabel"></label>
          <input id="riderId" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="1001">
        </div>
        <button id="loginBtn" class="btn"></button>
      </div>
    </section>

    <section id="homeView" class="hidden">
      <div class="hello"><h1 id="hello"></h1><span class="id" id="riderTag"></span></div>

      <div id="ask" class="ask hidden" role="status"><span class="dot"></span><span id="askText"></span></div>

      <div class="card">
        <span class="badge" id="badge"></span>
        <h2 id="statusTitle"></h2>
        <p class="muted" id="statusText" style="margin-top:4px"></p>
        <ol class="stepper" id="stepper"></ol>
        <p class="note hidden" id="stickyNote"><span>📌</span><span id="stickyText"></span></p>
      </div>

      <details class="card" id="settings" style="padding:0">
        <summary id="settingsTitle"></summary>
        <div class="body">
          <div class="setting">
            <p id="pushState"></p>
            <button id="enableBtn" class="btn quiet"></button>
            <button id="testBtn" class="btn quiet hidden"></button>
          </div>
          <div class="setting">
            <p id="liveState"></p>
            <button id="liveBtn" class="btn quiet"></button>
          </div>
          <div class="setting" id="installRow">
            <p id="installText"></p>
            <button id="installBtn" class="btn quiet hidden"></button>
          </div>
          <div class="setting"><button id="logoutBtn" class="btn quiet"></button></div>
        </div>
      </details>
    </section>
  </main>

  <div class="dock hidden" id="dock"><div class="in"><div class="row" id="actions"></div></div></div>
  <p id="message" role="status" aria-live="polite" class="hidden"></p>

    const LANGS = ["ar", "ur", "bn"];

    /* ===================== Helpers ===================== */
    const $ = (id) => document.getElementById(id);
    const getToken = () => { try { return localStorage.getItem("riderToken"); } catch { return null; } };
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      del(k) { try { localStorage.removeItem(k); } catch {} },
    };
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    function detectLang() {
      const saved = store.get("lang");
      if (LANGS.includes(saved)) return saved;
      const n = (navigator.language || "").toLowerCase();
      if (n.startsWith("ur")) return "ur";
      if (n.startsWith("bn")) return "bn";
      return "ar";
    }
    let lang = detectLang();
    const T = () => I18N[lang];

    let msgTimer = null;
    function msg(text, sticky) {
      const el = $("message");
      clearTimeout(msgTimer);
      if (!text) { el.classList.add("hidden"); el.textContent = ""; return; }
      el.textContent = text;
      el.classList.remove("hidden");
      if (!sticky) msgTimer = setTimeout(() => msg(""), 5000);
    }
    const errText = (code, fallback) => (T().e[code] || fallback || T().e.generic);

    const fmtTime = (ms) => (ms ? new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "");

    async function post(path, data) {
      const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      return { status: res.status, body: await res.json().catch(() => ({})) };
    }

    /* ===================== Language ===================== */
    let last = { order: null, prompt: null };
    let rider = null;

    function applyLang() {
      const t = T();
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      $("appName").textContent = t.app;
      document.title = t.app;
      $("loginTitle").textContent = t.loginTitle;
      $("loginSub").textContent = t.loginSub;
      $("idLabel").textContent = t.idLabel;
      $("loginBtn").textContent = t.login;
      $("settingsTitle").textContent = t.settings;
      $("enableBtn").textContent = t.enable;
      $("testBtn").textContent = t.test;
      $("installBtn").textContent = t.install;
      $("logoutBtn").textContent = t.logout;
      $("stickyText").textContent = t.sticky;
      if (rider) {
        $("hello").textContent = rider.name && rider.name !== rider.id ? t.hello_name.replace("{n}", rider.name) : t.hello;
        $("riderTag").textContent = "#" + rider.id;
      }
      render(last);
      renderLive();
      renderInstall();
      setPushUI(pushOn);
    }

    document.querySelectorAll(".langs button").forEach((b) =>
      b.addEventListener("click", async () => {
        lang = b.dataset.lang;
        store.set("lang", lang);
        applyLang();
        if (getToken()) {
          try { await post("/api/lang", { token: getToken(), lang }); } catch {}
          syncNotification();
        }
      })
    );

    /* ===================== Views ===================== */
    function showLogin() {
      $("homeView").classList.add("hidden");
      $("loginView").classList.remove("hidden");
      $("dock").classList.add("hidden");
      document.body.classList.add("no-dock");
      stopLive();
    }

    function showHome(r) {
      rider = r;
      $("loginView").classList.add("hidden");
      $("homeView").classList.remove("hidden");
      $("hello").textContent = r.name && r.name !== r.id ? T().hello_name.replace("{n}", r.name) : T().hello;
      $("riderTag").textContent = "#" + r.id;
      renderLive();
      renderInstall();
    }

    /* ===================== Order state ===================== */
    const STAGES = ["declared", "arrived", "picked_up", "delivered"];
    let busy = false;

    function mkBtn(action, label, cls) {
      const b = document.createElement("button");
      b.className = "btn " + (cls || "");
      b.textContent = label;
      b.addEventListener("click", () => act(action));
      return b;
    }

    function render(s) {
      last = s || { order: null, prompt: null };
      const t = T();
      const o = last.order, p = last.prompt;
      const stage = o ? o.stage : "idle";

      // banner
      const askText = p && t.ask[p.type];
      $("ask").classList.toggle("hidden", !askText);
      $("ask").classList.toggle("late", !!(p && p.status === "missed"));
      $("askText").textContent = askText || "";

      // card
      const badge = $("badge");
      badge.className = "badge b-" + stage;
      badge.textContent = t.badge[stage] || "";
      $("statusTitle").textContent = t.title[stage] || "";
      $("statusText").textContent = t.text[stage] || "";

      // stepper
      const idx = o ? STAGES.indexOf(o.stage) : -1;
      const times = o ? [o.declared_at, o.arrived_at, o.picked_at, null] : [];
      const ol = $("stepper");
      ol.replaceChildren();
      STAGES.forEach((st, i) => {
        const li = document.createElement("li");
        if (o && i <= idx) li.className = i === idx ? "now done" : "done";
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = o && i < idx ? "✓" : String(i + 1);
        const label = document.createElement("span");
        label.textContent = t.steps[st];
        li.append(n, label);
        if (times[i]) {
          const tm = document.createElement("span");
          tm.className = "t";
          tm.textContent = fmtTime(times[i]);
          li.append(tm);
        }
        ol.append(li);
      });
      $("stickyNote").classList.toggle("hidden", !o);

      // actions
      const actions = $("actions");
      actions.replaceChildren();
      actions.classList.remove("two");
      if (!o) {
        actions.append(mkBtn("have_order", t.act.have_order, "amber"));
        if (p && p.type === "have_order") actions.append(mkBtn("no_order", t.act.no_order, "quiet"));
      } else {
        if (o.stage === "declared") {
          actions.append(mkBtn("arrived", t.act.arrived, "violet"));
          actions.append(mkBtn("picked_up", t.act.picked_up, "blue"));
        } else if (o.stage === "arrived") {
          actions.append(mkBtn("picked_up", t.act.picked_up, "blue"));
        } else {
          actions.append(mkBtn("delivered", t.act.delivered, "green"));
        }
        if (p && (p.type === "picked_up" || p.type === "delivered")) actions.append(mkBtn("not_yet", t.act.not_yet, "quiet"));
        actions.append(mkBtn("cancel", t.act.cancel, "danger"));
      }
      $("dock").classList.toggle("hidden", $("homeView").classList.contains("hidden"));
      document.body.classList.toggle("no-dock", $("homeView").classList.contains("hidden"));
      if (busy) document.querySelectorAll("#actions button").forEach((b) => (b.disabled = true));
    }

    function getPos() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        // an unanswered permission prompt never times out by itself, so cap the wait
        setTimeout(() => resolve(null), 8000);
        navigator.geolocation.getCurrentPosition(
          (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
        );
      });
    }

    /* Keep the pinned notification in step with the app */
    async function syncNotification() {
      try {
        if (!("serviceWorker" in navigator)) return;
        const reg = await navigator.serviceWorker.getRegistration();
        const target = (reg && (reg.active || reg.waiting)) || navigator.serviceWorker.controller;
        if (target) target.postMessage({ type: "sync", token: getToken() });
      } catch {}
    }
    async function giveTokenToWorker() {
      try {
        if (!("serviceWorker" in navigator)) return;
        const reg = await navigator.serviceWorker.ready;
        if (reg.active) reg.active.postMessage({ type: "token", token: getToken() });
      } catch {}
    }

    const NEEDS_LOC = ["have_order", "arrived", "picked_up", "delivered"];

    async function act(action) {
      if (busy) return;
      if (action === "cancel" && !confirm(T().confirmCancel)) return;
      busy = true;
      document.querySelectorAll("#actions button").forEach((b) => (b.disabled = true));
      try {
        let loc = null;
        if (NEEDS_LOC.includes(action)) {
          msg(T().locating, true);
          loc = await getPos();
        }
        const { status, body } = await post("/api/respond", { token: getToken(), action, ...(loc || {}) });
        if (status === 401) {
          store.del("riderToken");
          showLogin();
          return msg(errText("session"));
        }
        if (!body.ok) return msg(errText(body.code));
        render(body);
        syncNotification();
        msg(T().done[action] + (NEEDS_LOC.includes(action) && !loc ? " " + T().noLoc : ""));
      } catch {
        msg(errText("network"));
      } finally {
        busy = false;
        render(last);
      }
    }

    let pushOn = false;
    async function refresh() {
      const token = getToken();
      if (!token) return;
      try {
        const { status, body } = await post("/api/me", { token });
        if (body.ok) {
          if (body.lang && !store.get("lang")) { lang = body.lang; store.set("lang", lang); }
          if ($("homeView").classList.contains("hidden")) showHome(body.rider);
          rider = body.rider;
          pushOn = !!body.pushEnabled;
          setPushUI(pushOn);
          if (!busy) { applyLang(); render(body); }
          giveTokenToWorker();
          syncNotification();
        } else if (status === 401) {
          store.del("riderToken");
          showLogin();
        }
      } catch {
        if (!busy) msg(errText("offline"));
      }
    }

    /* ===================== Login ===================== */
    $("loginBtn").addEventListener("click", async () => {
      const id = $("riderId").value.trim();
      if (!id) return msg(errText("id_required"));
      msg(T().checking, true);
      try {
        const { body } = await post("/api/login", { id, lang });
        if (!body.ok) return msg(errText(body.code, body.error));
        store.set("riderToken", body.token);
        store.set("riderInfo", JSON.stringify(body.rider));
        msg("");
        showHome(body.rider);
        render({ order: null, prompt: null });
        refresh();
      } catch {
        msg(errText("network"));
      }
    });
    $("riderId").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

    $("logoutBtn").addEventListener("click", async () => {
      if (!confirm(T().confirmLogout)) return;
      store.del("riderToken");
      store.del("riderInfo");
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) {
          (await reg.getNotifications()).forEach((n) => n.close());
          if (reg.active) reg.active.postMessage({ type: "token", token: null });
        }
      } catch {}
      rider = null;
      last = { order: null, prompt: null };
      showLogin();
      msg(T().loggedOut);
    });

    /* ===================== Notifications ===================== */
    function urlBase64ToUint8Array(s) {
      const padding = "=".repeat((4 - (s.length % 4)) % 4);
      const raw = atob((s + padding).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    function setPushUI(enabled) {
      pushOn = enabled;
      $("enableBtn").classList.toggle("hidden", enabled);
      $("testBtn").classList.toggle("hidden", !enabled);
      $("enableBtn").disabled = false;
      $("pushState").textContent = enabled ? T().pushOn : T().pushOff;
      if (!enabled && isIOS && !isStandalone) {
        $("enableBtn").disabled = true;
        $("pushState").textContent = T().pushIos;
      }
    }

    $("enableBtn").addEventListener("click", async () => {
      if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
        return msg(errText("unsupported"));
      }
      try {
        msg(T().enabling, true);
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return msg(errText("perm"));
        const reg = await navigator.serviceWorker.ready;
        const keyRes = await fetch("/api/vapid-key").then((r) => r.json());
        if (!keyRes || !keyRes.key) return msg(errText("server"));
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(keyRes.key) });
        }
        const { body } = await post("/api/subscribe", { token: getToken(), subscription: sub.toJSON() });
        if (!body.ok) return msg(errText(body.code));
        setPushUI(true);
        giveTokenToWorker();
        msg(T().enabled);
      } catch (e) {
        msg(errText("generic") + " " + (e && e.message ? e.message : ""));
      }
    });

    $("testBtn").addEventListener("click", async () => {
      msg(T().testing, true);
      try {
        const { body } = await post("/api/test-push", { token: getToken() });
        if (body.ok) msg(T().testSent);
        else {
          if (body.code === "push_expired" || body.code === "push_off") setPushUI(false);
          msg(errText(body.code));
        }
      } catch {
        msg(errText("network"));
      }
    });

    /* ===================== Live location ===================== */
    let watchId = null, lastSent = 0;
    const liveOn = () => store.get("liveShare") === "1";

    function startLive() {
      if (watchId !== null || !navigator.geolocation) return;
      watchId = navigator.geolocation.watchPosition(
        (p) => {
          const now = Date.now();
          if (now - lastSent < 20000) return;
          lastSent = now;
          post("/api/location", { token: getToken(), lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }).catch(() => {});
        },
        (err) => {
          if (err && err.code === 1) {
            store.del("liveShare");
            stopLive();
            renderLive();
            msg(T().liveDenied);
          }
        },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
      );
    }
    function stopLive() {
      if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    function renderLive() {
      const on = liveOn();
      $("liveState").textContent = on ? T().liveOn : T().liveOff;
      $("liveBtn").textContent = on ? T().liveStop : T().liveStart;
      if (on && getToken()) startLive(); else stopLive();
    }
    $("liveBtn").addEventListener("click", () => {
      if (liveOn()) store.del("liveShare"); else store.set("liveShare", "1");
      renderLive();
    });

    /* ===================== Install ===================== */
    let deferredInstall = null;
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; renderInstall(); });
    window.addEventListener("appinstalled", () => { deferredInstall = null; renderInstall(); });

    function renderInstall() {
      if (isStandalone) return $("installRow").classList.add("hidden");
      $("installRow").classList.remove("hidden");
      $("installBtn").classList.toggle("hidden", !deferredInstall);
      $("installText").textContent = isIOS ? T().installIos : deferredInstall ? T().installReady : T().installChrome;
    }
    $("installBtn").addEventListener("click", async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice.catch(() => {});
      deferredInstall = null;
      renderInstall();
    });

    /* ===================== Start ===================== */
    // Buttons on the notification open the app with ?do=action (or the worker posts a message)
    let pendingDo = null;
    function takeDo() {
      try {
        const u = new URL(location.href);
        const a = u.searchParams.get("do");
        if (a) { pendingDo = a; history.replaceState(null, "", u.pathname); }
      } catch {}
    }
    function runPendingDo() {
      if (!pendingDo || !getToken()) return;
      const a = pendingDo;
      pendingDo = null;
      // only run steps that are valid right now, otherwise just show the screen
      const stage = last.order ? last.order.stage : null;
      const ok =
        (a === "have_order" && !last.order) || a === "no_order" ||
        (a === "arrived" && stage === "declared") ||
        (a === "picked_up" && (stage === "declared" || stage === "arrived")) ||
        (a === "delivered" && !!stage);
      if (ok) act(a);
    }

    (async function init() {
      takeDo();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data && e.data.type === "do") { pendingDo = e.data.action; refresh().then(runPendingDo); }
        });
      }
      applyLang();
      if (getToken()) {
        let cached = null;
        try { cached = JSON.parse(store.get("riderInfo")); } catch {}
        if (cached && cached.id) { showHome(cached); render({ order: null, prompt: null }); }
        $("statusTitle").textContent = T().loading;
        await refresh();
        runPendingDo();
      } else {
        showLogin();
      }
      setInterval(() => { if (!document.hidden) refresh(); }, 30000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    })();
  </script>
</body>
</html>
