<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>متابعة المناديب</title>
  <meta name="theme-color" content="#101827">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101827;
      --surface: #1b2638;
      --surface-2: #243247;
      --line: #33435c;
      --text: #f2f5f9;
      --muted: #a9b6c9;
      --declared: #e0a100;
      --arrived: #9b7bff;
      --picked: #3fa7f5;
      --done: #2fbf7a;
      --late: #ff6b66;
      --focus: #8ecbff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
      line-height: 1.6;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { max-width: 460px; margin: 0 auto; padding-top: 20px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    /* تسجيل الدخول */
    .card { background: var(--surface); border-radius: 16px; padding: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 15px; }
    input {
      width: 100%; padding: 16px; border-radius: 12px; font: inherit; font-size: 18px;
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
    }
    button {
      width: 100%; padding: 16px; border: 0; border-radius: 12px; font: inherit;
      font-size: 17px; font-weight: 700; color: #fff; background: #16a34a; cursor: pointer;
      min-height: 56px;
    }
    button:disabled { opacity: .5; cursor: default; }
    button + button, input + button { margin-top: 12px; }
    .btn-quiet { background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 16px; min-height: 48px; }
    .btn-danger { background: transparent; color: var(--late); border: 1px solid var(--late); font-size: 15px; min-height: 48px; font-weight: 600; }
    .btn-declared { background: var(--declared); color: #1d1500; }
    .btn-arrived { background: var(--arrived); color: #130a3b; }
    .btn-picked { background: var(--picked); color: #04213a; }
    .btn-done { background: var(--done); color: #03261a; }

    /* الرأس */
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .top .who { font-size: 15px; color: var(--muted); }

    /* مراحل الأوردر */
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
    .steps li { text-align: center; font-size: 13px; color: var(--muted); }
    .steps li::before {
      content: ""; display: block; height: 6px; border-radius: 3px; background: var(--surface-2); margin-bottom: 6px;
    }
    .steps li.on { color: var(--text); font-weight: 700; }
    .steps li.on::before { background: var(--c, var(--done)); }
    .steps li small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

    /* الحالة */
    .status { padding: 18px; border-radius: 16px; background: var(--surface); margin-bottom: 12px; }
    .status h2 { font-size: 20px; margin: 0 0 4px; }
    .ask {
      border: 2px solid var(--declared); background: rgba(224, 161, 0, .12);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600;
    }
    .ask.late { border-color: var(--late); background: rgba(255, 107, 102, .12); }
    .actions { display: grid; gap: 10px; }

    /* الإعدادات */
    details { margin-top: 20px; background: var(--surface); border-radius: 16px; padding: 4px 16px; }
    summary { padding: 14px 0; font-weight: 600; cursor: pointer; }
    details > div { padding-bottom: 16px; }
    .row { margin-top: 14px; }
    .row p { margin-bottom: 8px; font-size: 15px; }
    #message { margin-top: 16px; min-height: 24px; color: var(--muted); font-size: 15px; }

    @media (prefers-reduced-motion: no-preference) {
      .status { animation: rise .25s ease-out; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main>
    <section id="loginView" class="hidden">
      <h1>متابعة المناديب</h1>
      <p class="muted" style="margin-bottom:16px">سجّل رقمك مرة واحدة وهيفتكرك الجهاز.</p>
      <div class="card">
        <label for="riderId">رقم المندوب</label>
        <input id="riderId" type="text" inputmode="numeric" autocomplete="off" placeholder="مثال: 1001">
        <button id="loginBtn">دخول</button>
      </div>
    </section>

    <section id="homeView" class="hidden">
      <div class="top">
        <h1 id="hello">أهلًا</h1>
        <span class="who" id="riderTag"></span>
      </div>

      <ol class="steps" id="steps" aria-label="مراحل الأوردر">
        <li data-stage="declared" style="--c:var(--declared)">معاك أوردر<small></small></li>
        <li data-stage="arrived" style="--c:var(--arrived)">وصلت المطعم<small></small></li>
        <li data-stage="picked_up" style="--c:var(--picked)">استلمت<small></small></li>
        <li data-stage="delivered" style="--c:var(--done)">سلّمت<small></small></li>
      </ol>

      <div id="ask" class="ask hidden" role="status"></div>

      <div class="status">
        <h2 id="statusTitle"></h2>
        <p class="muted" id="statusText"></p>
      </div>

      <div class="actions" id="actions"></div>

      <details id="settings">
        <summary>الإعدادات</summary>
        <div>
          <div class="row">
            <p id="pushState"></p>
            <button id="enableBtn" class="btn-quiet">تفعيل الإشعارات</button>
            <button id="testBtn" class="btn-quiet hidden">جرّب إشعار</button>
          </div>
          <div class="row">
            <p id="liveState"></p>
            <button id="liveBtn" class="btn-quiet">تشغيل مشاركة الموقع</button>
          </div>
          <div class="row" id="installRow">
            <p id="installText">ثبّت التطبيق على الشاشة الرئيسية علشان الإشعارات توصلك دايمًا.</p>
            <button id="installBtn" class="btn-quiet hidden">إضافة للشاشة الرئيسية</button>
          </div>
          <div class="row">
            <button id="logoutBtn" class="btn-quiet">تسجيل خروج</button>
          </div>
        </div>
      </details>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (t) => { $("message").textContent = t || ""; };
    const getToken = () => localStorage.getItem("riderToken");

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    const fmtTime = (ms) =>
      ms ? new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";

    async function post(path, data) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      return { status: res.status, body: await res.json().catch(() => ({})) };
    }

    /* ---------------- الشاشات ---------------- */
    function renderLoading() {
      $("ask").classList.add("hidden");
      $("actions").replaceChildren();
      $("statusTitle").textContent = "جاري التحميل...";
      $("statusText").textContent = "";
      document.querySelectorAll("#steps li").forEach((li) => {
        li.classList.remove("on");
        li.querySelector("small").textContent = "";
      });
    }

    function showLogin() {
      $("homeView").classList.add("hidden");
      $("loginView").classList.remove("hidden");
      stopLive();
    }

    let rider = null;
    function showHome(r, pushEnabled) {
      rider = r;
      $("loginView").classList.add("hidden");
      $("homeView").classList.remove("hidden");
      $("hello").textContent = r.name && r.name !== r.id ? "أهلًا " + r.name : "أهلًا";
      $("riderTag").textContent = "رقم " + r.id;
      setPushUI(!!pushEnabled);
      renderInstall();
      renderLive();
    }

    /* ---------------- حالة الأوردر ---------------- */
    const STAGES = ["declared", "arrived", "picked_up", "delivered"];
    let busy = false;

    function mkBtn(action, label, cls) {
      const b = document.createElement("button");
      b.textContent = label;
      if (cls) b.className = cls;
      b.addEventListener("click", () => act(action));
      return b;
    }

    function render(s) {
      const o = s.order, p = s.prompt;

      // المراحل
      const stageIdx = o ? STAGES.indexOf(o.stage) : -1;
      const times = o ? [o.declared_at, o.arrived_at, o.picked_at, null] : [];
      document.querySelectorAll("#steps li").forEach((li, i) => {
        li.classList.toggle("on", i <= stageIdx);
        li.querySelector("small").textContent = times[i] ? fmtTime(times[i]) : "";
      });

      // سؤال الإدارة
      const ask = $("ask");
      const askText = {
        have_order: "الإدارة بتسأل: معاك أوردر دلوقتي؟",
        picked_up: "الإدارة بتسأل: استلمت الأوردر؟",
        delivered: "الإدارة بتسأل: سلّمت الأوردر؟",
      }[p && p.type];
      ask.classList.toggle("hidden", !askText);
      ask.classList.toggle("late", !!(p && p.status === "missed"));
      ask.textContent = askText || "";

      // النص والأزرار
      const actions = $("actions");
      actions.replaceChildren();
      if (!o) {
        $("statusTitle").textContent = "مفيش أوردر معاك";
        $("statusText").textContent = "أول ما يجيلك أوردر دوس «معايا أوردر».";
        actions.append(mkBtn("have_order", "معايا أوردر", "btn-declared"));
        if (p && p.type === "have_order") actions.append(mkBtn("no_order", "لأ، مفيش أوردر", "btn-quiet"));
      } else if (o.stage === "declared") {
        $("statusTitle").textContent = "معاك أوردر";
        $("statusText").textContent = "في الطريق للمطعم.";
        actions.append(mkBtn("arrived", "وصلت المطعم", "btn-arrived"));
        actions.append(mkBtn("picked_up", "استلمت الأوردر", "btn-picked"));
      } else if (o.stage === "arrived") {
        $("statusTitle").textContent = "أنت عند المطعم";
        $("statusText").textContent = "أول ما تستلم الأوردر دوس استلمت.";
        actions.append(mkBtn("picked_up", "استلمت الأوردر", "btn-picked"));
      } else {
        $("statusTitle").textContent = "الأوردر معاك";
        $("statusText").textContent = "في الطريق للعميل.";
        actions.append(mkBtn("delivered", "سلّمت الأوردر", "btn-done"));
      }
      if (o && p && (p.type === "picked_up" || p.type === "delivered")) {
        actions.append(mkBtn("not_yet", "لسه", "btn-quiet"));
      }
      if (o) actions.append(mkBtn("cancel", "إلغاء الأوردر (دوست بالغلط)", "btn-danger"));
    }

    function setBusy(v) {
      busy = v;
      document.querySelectorAll("#actions button").forEach((b) => (b.disabled = v));
    }

    function getPos() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
        );
      });
    }

    async function clearNotifications() {
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) (await reg.getNotifications()).forEach((n) => n.close());
      } catch {}
    }

    const DONE_MSG = {
      have_order: "اتسجّل إن معاك أوردر.",
      no_order: "تمام، اتسجّل إن مفيش أوردر.",
      arrived: "اتسجّل إنك وصلت المطعم.",
      picked_up: "اتسجّل إنك استلمت الأوردر.",
      delivered: "تمام، الأوردر اتسلّم. شكرًا!",
      cancel: "اتلغى الأوردر.",
      not_yet: "تمام، هنسألك تاني بعد شوية.",
    };

    async function act(action) {
      if (busy) return;
      if (action === "cancel" && !confirm("متأكد إنك عايز تلغي الأوردر؟")) return;
      setBusy(true);
      try {
        let loc = null;
        if (["have_order", "arrived", "picked_up", "delivered"].includes(action)) {
          msg("بنحدد موقعك...");
          loc = await getPos();
        }
        const { status, body } = await post("/api/respond", { token: getToken(), action, ...(loc || {}) });
        if (status === 401) {
          localStorage.removeItem("riderToken");
          showLogin();
          return msg("انتهت الجلسة. سجّل دخول تاني.");
        }
        if (!body.ok) return msg(body.error || "حصل خطأ، جرّب تاني.");
        render(body);
        clearNotifications();
        const needsLoc = ["have_order", "arrived", "picked_up", "delivered"].includes(action);
        msg(DONE_MSG[action] + (needsLoc && !loc ? " (اتسجّل من غير موقع، فعّل الموقع من إعدادات المتصفح)" : ""));
      } catch {
        msg("تعذر الاتصال. تأكد من الإنترنت وجرّب تاني.");
      } finally {
        setBusy(false);
      }
    }

    async function refresh() {
      const token = getToken();
      if (!token) return;
      try {
        const { status, body } = await post("/api/me", { token });
        if (body.ok) {
          if ($("homeView").classList.contains("hidden")) showHome(body.rider, body.pushEnabled);
          setPushUI(!!body.pushEnabled);
          if (!busy) render(body);
        } else if (status === 401) {
          localStorage.removeItem("riderToken");
          showLogin();
        }
      } catch {
        if (!busy) msg("مفيش اتصال بالإنترنت حاليًا.");
      }
    }

    /* ---------------- تسجيل الدخول ---------------- */
    $("loginBtn").addEventListener("click", async () => {
      const id = $("riderId").value.trim();
      if (!id) return msg("اكتب رقم المندوب.");
      msg("جاري التحقق...");
      try {
        const { body } = await post("/api/login", { id });
        if (!body.ok) return msg(body.error || "حصل خطأ");
        localStorage.setItem("riderToken", body.token);
        localStorage.setItem("riderInfo", JSON.stringify(body.rider));
        msg("");
        showHome(body.rider, false);
        renderLoading();
        refresh();
      } catch {
        msg("تعذر الاتصال. تأكد من الإنترنت.");
      }
    });
    $("riderId").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

    $("logoutBtn").addEventListener("click", () => {
      if (!confirm("تسجيل الخروج؟ هتحتاج تكتب رقمك تاني.")) return;
      localStorage.removeItem("riderToken");
      localStorage.removeItem("riderInfo");
      showLogin();
      msg("تم تسجيل الخروج.");
    });

    /* ---------------- الإشعارات ---------------- */
    function urlBase64ToUint8Array(s) {
      const padding = "=".repeat((4 - (s.length % 4)) % 4);
      const raw = atob((s + padding).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    function setPushUI(enabled) {
      $("enableBtn").classList.toggle("hidden", enabled);
      $("testBtn").classList.toggle("hidden", !enabled);
      $("pushState").textContent = enabled ? "الإشعارات شغّالة على جهازك ✅" : "الإشعارات مقفولة على جهازك.";
      if (!enabled && isIOS && !isStandalone) {
        $("enableBtn").disabled = true;
        $("pushState").textContent = "على الآيفون: ضيف التطبيق للشاشة الرئيسية الأول، وافتحه من الأيقونة، وبعدها فعّل الإشعارات.";
      }
    }

    $("enableBtn").addEventListener("click", async () => {
      if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
        return msg("المتصفح ده مش بيدعم الإشعارات.");
      }
      try {
        msg("جاري التفعيل...");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return msg("لازم توافق على الإشعارات علشان تشتغل.");
        const reg = await navigator.serviceWorker.ready;
        const keyRes = await fetch("/api/vapid-key").then((r) => r.json());
        if (!keyRes || !keyRes.key) return msg("السيرفر مش جاهز للإشعارات. كلّم الإدارة.");
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(keyRes.key),
          });
        }
        const { body } = await post("/api/subscribe", { token: getToken(), subscription: sub.toJSON() });
        if (!body.ok) return msg(body.error || "فشل حفظ الاشتراك");
        setPushUI(true);
        msg("تم تفعيل الإشعارات.");
      } catch (e) {
        msg("حصل خطأ أثناء التفعيل: " + (e && e.message ? e.message : e));
      }
    });

    $("testBtn").addEventListener("click", async () => {
      msg("بنبعت إشعار تجريبي... اقفل الشاشة وانتظر ثواني.");
      try {
        const { body } = await post("/api/test-push", { token: getToken() });
        if (body.ok) msg("تم الإرسال.");
        else {
          if (/انتهى|غير مفعّلة/.test(body.error || "")) setPushUI(false);
          msg(body.error || "فشل الإرسال");
        }
      } catch {
        msg("تعذر الاتصال. تأكد من الإنترنت.");
      }
    });

    /* ---------------- الموقع الحي (والتطبيق مفتوح بس) ---------------- */
    let watchId = null, lastSent = 0;
    const liveOn = () => localStorage.getItem("liveShare") === "1";

    function startLive() {
      if (watchId !== null || !navigator.geolocation) return;
      watchId = navigator.geolocation.watchPosition(
        (p) => {
          const now = Date.now();
          if (now - lastSent < 20000) return;
          lastSent = now;
          post("/api/location", {
            token: getToken(), lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy,
          }).catch(() => {});
        },
        (err) => {
          if (err && err.code === 1) {
            localStorage.removeItem("liveShare");
            stopLive();
            renderLive();
            msg("الموقع مرفوض. فعّله من إعدادات المتصفح للموقع ده.");
          }
        },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
      );
    }
    function stopLive() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    function renderLive() {
      const on = liveOn();
      $("liveState").textContent = on
        ? "موقعك بيتشارك مع الإدارة طول ما التطبيق مفتوح."
        : "مشاركة الموقع مقفولة. الموقع بيتسجّل وقت الأزرار بس.";
      $("liveBtn").textContent = on ? "إيقاف مشاركة الموقع" : "تشغيل مشاركة الموقع";
      if (on) startLive(); else stopLive();
    }
    $("liveBtn").addEventListener("click", () => {
      if (liveOn()) localStorage.removeItem("liveShare"); else localStorage.setItem("liveShare", "1");
      renderLive();
    });

    /* ---------------- تثبيت التطبيق ---------------- */
    let deferredInstall = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstall = e;
      renderInstall();
    });
    window.addEventListener("appinstalled", () => { deferredInstall = null; renderInstall(); });

    function renderInstall() {
      if (isStandalone) return $("installRow").classList.add("hidden");
      $("installRow").classList.remove("hidden");
      $("installBtn").classList.toggle("hidden", !deferredInstall);
      $("installText").textContent = isIOS
        ? "من زر المشاركة في سفاري اختار «إضافة إلى الشاشة الرئيسية»، وافتح التطبيق من الأيقونة."
        : deferredInstall
          ? "ثبّت التطبيق على الشاشة الرئيسية علشان الإشعارات توصلك دايمًا."
          : "من قائمة كروم (⋮) اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».";
    }
    $("installBtn").addEventListener("click", async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice.catch(() => {});
      deferredInstall = null;
      renderInstall();
    });

    /* ---------------- تشغيل ---------------- */
    (function init() {
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
      if (getToken()) {
        let cached = null;
        try { cached = JSON.parse(localStorage.getItem("riderInfo")); } catch {}
        if (cached && cached.id) { showHome(cached, false); renderLoading(); }
        refresh();
      } else {
        showLogin();
      }
      setInterval(() => { if (!document.hidden) refresh(); }, 30000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    })();
  </script>
</body>
</html>
