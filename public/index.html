<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Link</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --text: #0f1b2d;
      --muted: #5b6b7f;
      --line: #e2e8ef;
      --brand: #0f766e;
      --brand-d: #0b5d57;
      --brand-soft: #e3f4f2;
      --amber: #b45309; --amber-soft: #fef3c7;
      --violet: #6d28d9; --violet-soft: #ede9fe;
      --blue: #1d4ed8; --blue-soft: #dbeafe;
      --green: #15803d; --green-soft: #dcfce7;
      --red: #b42318; --red-soft: #fee4e2;
      --shadow: 0 1px 2px rgba(15,27,45,.06), 0 8px 24px rgba(15,27,45,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --surface: #141d2e; --text: #eef2f7; --muted: #9aa9bd; --line: #243249;
        --brand: #2dd4bf; --brand-d: #14b8a6; --brand-soft: #0f2e2e;
        --amber: #fbbf24; --amber-soft: #3a2a08;
        --violet: #a78bfa; --violet-soft: #271f47;
        --blue: #60a5fa; --blue-soft: #14284d;
        --green: #4ade80; --green-soft: #0f2f1c;
        --red: #f87171; --red-soft: #3a1514;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--text);
      font-family: "Noto Sans Arabic", "Noto Sans Bengali", Inter, system-ui, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.55; font-size: 16px;
    }
    .hidden { display: none !important; }
    p { margin: 0; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

    .appbar {
      position: sticky; top: 0; z-index: 5;
      background: var(--brand); color: #fff;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    @media (prefers-color-scheme: dark) { .appbar { background: #0f2e2e; } }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; background: #fff; }
    .langs { display: flex; gap: 4px; background: rgba(255,255,255,.16); padding: 3px; border-radius: 999px; }
    .langs button {
      border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; font-weight: 600;
      padding: 5px 11px; border-radius: 999px; cursor: pointer; min-height: 30px;
    }
    .langs button[aria-pressed="true"] { background: #fff; color: #0b5d57; }
    @media (prefers-color-scheme: dark) { .langs button[aria-pressed="true"] { background: #2dd4bf; color: #04201d; } }

    main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; }
    h1 { font-size: 24px; margin: 0 0 6px; line-height: 1.3; }
    h2 { font-size: 20px; margin: 0; line-height: 1.35; }
    .muted { color: var(--muted); }

    /* login */
    .hero { text-align: center; padding: 28px 8px 20px; }
    .hero img { width: 72px; height: 72px; border-radius: 20px; box-shadow: var(--shadow); }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 15px; }
    input[type=text] {
      width: 100%; padding: 15px 16px; font: inherit; font-size: 20px; letter-spacing: .5px;
      border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text);
      text-align: center; direction: ltr;
    }
    input[type=text]:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 4px var(--brand-soft); }
    button.btn {
      width: 100%; min-height: 56px; padding: 14px 18px; border: 0; border-radius: 14px; cursor: pointer;
      font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: var(--brand-d);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    @media (prefers-color-scheme: dark) { button.btn { color: #04201d; background: var(--brand); } }
    button.btn:active { transform: scale(.985); }
    button.btn:disabled { opacity: .55; cursor: default; }
    .btn.amber { background: #d97706; color: #fff; }
    .btn.violet { background: #6d28d9; color: #fff; }
    .btn.blue { background: #1d4ed8; color: #fff; }
    .btn.green { background: #15803d; color: #fff; }
    .btn.danger-fill { background: #b42318; color: #fff; }
    .btn.quiet { background: var(--bg); color: var(--text); border: 1px solid var(--line); min-height: 50px; font-size: 16px; font-weight: 600; }
    .btn.danger { background: transparent; color: var(--red); border: 1px solid var(--line); min-height: 46px; font-size: 15px; font-weight: 600; }
    .stack > * + * { margin-top: 12px; }

    /* hello */
    .hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 14px; }
    .hello .id { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; direction: ltr; }

    /* ask banner */
    .ask {
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;
      background: var(--amber-soft); border: 1.5px solid var(--amber); color: var(--text);
      border-radius: 16px; padding: 14px 16px; font-weight: 700;
    }
    .ask.late { background: var(--red-soft); border-color: var(--red); }
    .ask .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); margin-top: 7px; flex: none; animation: pulse 1.4s infinite; }
    .ask.late .dot { background: var(--red); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217,119,6,.5);} 100% { box-shadow: 0 0 0 12px rgba(217,119,6,0);} }
    @media (prefers-reduced-motion: reduce) { .ask .dot { animation: none; } }

    /* status */
    .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 10px; }
    .b-idle { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .b-declared { background: var(--amber-soft); color: var(--amber); }
    .b-arrived { background: var(--violet-soft); color: var(--violet); }
    .b-picked_up { background: var(--blue-soft); color: var(--blue); }

    /* stepper */
    .stepper { list-style: none; margin: 18px 0 0; padding: 0; }
    .stepper li { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--muted); }
    .stepper li .n {
      width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
      font-size: 13px; font-weight: 700; background: var(--bg); border: 2px solid var(--line); color: var(--muted);
    }
    .stepper li:not(:last-child)::after {
      content: ""; position: absolute; width: 2px; height: 18px; background: var(--line);
      inset-inline-start: 13px; top: 36px;
    }
    .stepper li.done { color: var(--text); }
    .stepper li.done .n { background: var(--brand-d); border-color: var(--brand-d); color: #fff; }
    @media (prefers-color-scheme: dark) { .stepper li.done .n { background: var(--brand); border-color: var(--brand); color: #04201d; } }
    .stepper li.now { color: var(--text); font-weight: 700; }
    .stepper li.now .n { border-color: var(--brand); color: var(--brand-d); background: var(--brand-soft); }
    .stepper .t { margin-inline-start: auto; font-size: 13px; font-weight: 600; direction: ltr; color: var(--muted); }

    .note { margin-top: 14px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; }

    /* sticky action bar */
    .dock {
      position: fixed; inset-inline: 0; bottom: 0; z-index: 6;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
    }
    .dock .in { max-width: 480px; margin: 0 auto; }
    .dock .row { display: grid; gap: 10px; }
    .dock .row.two { grid-template-columns: 1fr 1fr; }

    /* settings */
    details { margin-top: 16px; }
    summary { list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▾"; color: var(--muted); }
    details[open] summary::after { content: "▴"; }
    details .body { padding: 0 18px 18px; }
    .setting { padding-top: 14px; }
    .setting + .setting { border-top: 1px solid var(--line); margin-top: 14px; }
    .setting p { margin-bottom: 10px; font-size: 15px; }

    /* tabs */
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
    .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 2px; line-height: 1.25; border-radius: 11px; min-height: 44px; cursor: pointer; }
    .tabs button[aria-selected=true] { background: var(--brand-d); color: #fff; }
    @media (prefers-color-scheme: dark) { .tabs button[aria-selected=true] { background: var(--brand); color: #04201d; } }

    /* performance */
    .profile { background: linear-gradient(145deg, #0f172a, #1e293b); color: #fff; border-radius: 20px; padding: 22px; margin-bottom: 14px; }
    .profile .nm { font-size: 24px; font-weight: 800; line-height: 1.3; }
    .profile .pid { color: #cbd5e1; font-size: 14px; margin-top: 2px; }
    .profile .sl { color: #cbd5e1; font-size: 13px; margin-top: 14px; }
    .segpill { display: inline-block; min-width: 72px; text-align: center; border-radius: 14px; padding: 8px 18px; font-size: 26px; font-weight: 900; margin-top: 4px; color: #fff; }
    .change { border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; border: 2px solid; }
    .change.up { background: var(--green-soft); border-color: var(--green); }
    .change.down { background: var(--red-soft); border-color: var(--red); }
    .change.same { background: var(--blue-soft); border-color: var(--blue); }
    .change.none { background: var(--surface); border: 1px dashed var(--line); color: var(--muted); text-align: center; font-size: 14px; }
    .change .t { font-size: 17px; font-weight: 800; } .change .big { font-size: 30px; font-weight: 900; margin: 2px 0; direction: ltr; }
    .change .s { font-size: 13px; opacity: .85; }
    .change .why { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(128,128,128,.3); font-size: 14.5px; }
    .change .why ul { margin: 6px 0 0; padding-inline-start: 20px; }
    .target { border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; border: 2px solid; }
    .target.ok { background: var(--green-soft); border-color: var(--green); }
    .target.bad { background: var(--red-soft); border-color: var(--red); }
    .target .tt { font-size: 13.5px; font-weight: 700; opacity: .75; } .target .st { font-size: 19px; font-weight: 800; margin: 2px 0 10px; }
    .tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
    .tgrid div { background: var(--surface); border-radius: 12px; padding: 10px 6px; text-align: center; }
    .tgrid b { display: block; font-size: 22px; } .tgrid small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
    .target .ln { margin-top: 10px; font-size: 12.5px; opacity: .8; direction: ltr; }
    .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 14px; }
    .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
    .metric .l { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .metric .v { font-size: 22px; font-weight: 800; }
    .sect { font-size: 18px; font-weight: 800; margin: 18px 2px 10px; }
    .tips { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-top: 18px; box-shadow: var(--shadow); }
    .tips .tt { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .goal { background: var(--green-soft); border-radius: 14px; padding: 12px 6px; text-align: center; }
    .goal b { display: block; font-size: 22px; color: var(--green); } .goal small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
    .tnote { background: var(--amber-soft); color: var(--text); border: 1px solid var(--amber); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 600; margin: 8px 0 14px; }
    .tstep { display: flex; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .tstep .no { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand-d); color: #fff; display: grid; place-items: center; font-weight: 800; }
    @media (prefers-color-scheme: dark) { .tstep .no { background: var(--brand); color: #04201d; } }
    .tstep .h { font-weight: 800; margin-bottom: 4px; } .tstep .ln { font-size: 14.5px; margin: 3px 0; }
    .quote { background: #7c3f2b; color: #fff; border-radius: 12px; padding: 8px 12px; margin: 6px 0; display: inline-block; font-size: 14px; }
    .avoid { background: var(--red-soft); border: 1px solid var(--red); border-radius: 12px; padding: 12px; margin-top: 14px; font-size: 14.5px; }
    .closing { margin-top: 14px; font-weight: 700; text-align: center; }
    .tipimg { width: 100%; border-radius: 14px; margin-top: 14px; border: 1px solid var(--line); }
    .tipcap { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 0 8px; }
    .empty { text-align: center; color: var(--muted); padding: 26px 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }


    /* shift card */
    .shift { border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .shift.act { background: var(--amber-soft); border-color: var(--amber); }
    .shift.late { background: var(--red-soft); border-color: var(--red); }
    .shift.ok { background: var(--green-soft); border-color: var(--green); }
    .shift .sh-k { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .shift .sh-n { font-size: 21px; font-weight: 800; margin: 2px 0; }
    .shift .sh-t { font-size: 15px; font-weight: 700; direction: ltr; unicode-bidi: plaintext; }
    .shift .sh-s { margin-top: 8px; font-size: 14px; color: var(--muted); }
    .shift .sh-m { margin: 10px 0 12px; font-size: 14.5px; font-weight: 600; }
    .shift .sh-c { font-size: 16px; font-weight: 800; margin-top: 10px; }
    .shift .btn { margin-top: 4px; }
    /* schedule */
    .days { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; }
    .days button { flex: none; min-width: 52px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); border-radius: 14px; padding: 6px 4px; font: inherit; font-weight: 700; line-height: 1.25; }
    .days button small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
    .days button[aria-pressed=true] { background: var(--brand-d); border-color: var(--brand-d); color: #fff; }
    .days button[aria-pressed=true] small { color: #d6f1ee; }
    .slot { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: end; margin-bottom: 10px; }
    .slot b { font-size: 14px; padding-bottom: 12px; }
    .slot label { margin: 0; font-size: 12px; color: var(--muted); }
    .slot select.t24 { width: 100%; min-width: 0; padding: 12px 6px; font: inherit; font-size: 18px; font-weight: 700; border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text); direction: ltr; text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; }
    .slot input[type=time] { width: 100%; min-width: 0; padding: 10px 6px; font: inherit; font-size: 17px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); direction: ltr; text-align: center; }
    .scope { display: grid; gap: 8px; margin: 14px 0; }
    .scope label { display: flex; gap: 10px; align-items: center; margin: 0; font-weight: 600; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; }
    .scope input { width: 20px; height: 20px; }
    .wk { display: grid; gap: 6px; }
    .wk div { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }
    .wk span.t { direction: ltr; unicode-bidi: plaintext; font-weight: 700; }
    /* incentives */
    .inc { background: var(--surface); border: 1px solid var(--line); border-inline-start: 6px solid var(--ic, #f59e0b); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .inc-h { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
    .inc-i { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: color-mix(in srgb, var(--ic, #f59e0b) 18%, transparent); }
    .inc h3 { margin: 0; font-size: 18px; line-height: 1.35; }
    .inc-p { color: var(--muted); font-size: 14.5px; margin: 6px 0 10px; }
    .inc-l { margin: 6px 0 12px; padding-inline-start: 20px; font-size: 15px; }
    .inc-l li { margin: 6px 0; }
    .inc-f { background: var(--bg); border: 1px dashed var(--ic, #f59e0b); border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-weight: 700; font-size: 14.5px; }
    .inc-t { overflow-x: auto; margin: 12px -4px 4px; border-radius: 12px; }
    .inc-t table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 300px; }
    .inc-t th { background: var(--ic, #f59e0b); color: #1b1300; padding: 9px 8px; font-weight: 800; font-size: 12.5px; line-height: 1.3; text-align: center; }
    .inc-t td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); }
    .inc-t td:first-child { font-weight: 800; font-size: 17px; }
    .inc-t tr:nth-child(even) td { background: var(--bg); }
    .inc-n { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

    #message {
      position: fixed; inset-inline: 16px; top: calc(env(safe-area-inset-top) + 64px); z-index: 8;
      max-width: 448px; margin: 0 auto; background: #0f1b2d; color: #fff; padding: 12px 16px; border-radius: 12px;
      font-size: 14.5px; box-shadow: var(--shadow); text-align: center;
    }

    /* ===== Link visual refresh ===== */
    :root { --r: 22px; --g1: #0f766e; --g2: #0e4f6e; }
    body { background: radial-gradient(900px 420px at 100% -10%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 70%), radial-gradient(700px 380px at -10% 10%, color-mix(in srgb, var(--blue) 10%, transparent), transparent 70%), var(--bg); background-attachment: fixed; letter-spacing: .1px; }
    .appbar { background: linear-gradient(135deg, var(--g1), var(--g2)); border-radius: 0 0 26px 26px; padding-bottom: 16px; box-shadow: 0 10px 30px rgba(14,79,110,.28); }
    @media (prefers-color-scheme: dark) { .appbar { background: linear-gradient(135deg, #0f3a3a, #0e2a45); } }
    .brand { font-size: 20px; letter-spacing: .3px; }
    .brand img { width: 36px; height: 36px; border-radius: 11px; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
    .card { border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); box-shadow: 0 2px 4px rgba(15,27,45,.04), 0 14px 34px rgba(15,27,45,.09); animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card, .shift, .inc, .metric { animation: none !important; } }
    .hello h1 { font-size: 26px; font-weight: 800; }
    .hello .id { background: linear-gradient(135deg, var(--brand-soft), var(--surface)); border-color: var(--brand); color: var(--brand-d); }
    #ordersPane > .card { position: relative; overflow: hidden; padding: 24px 20px; text-align: center; }
    #ordersPane > .card::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--g1), #38bdf8, var(--g2)); }
    #statusTitle { font-size: 28px; font-weight: 800; margin-top: 2px; }
    #statusText { font-size: 15.5px; }
    #ordersPane .badge { font-size: 14px; padding: 5px 16px; letter-spacing: .3px; }
    .b-declared { box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 18%, transparent); }

          { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }

      });
    }

    function urlBase64ToUint8Array(s) {
      const padding = "=".repeat((4 - (s.length % 4)) % 4);
      const raw = atob((s + padding).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    function setPushUI(enabled) {

    // Keep the phone's push subscription in step with the server key (fixes "VapidPkHashMismatch" after a key change)
    async function syncPushKey() {
      try {
        if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return;
        if (Notification.permission !== "granted" || !getToken()) return;
        const keyRes = await fetch("/api/vapid-key").then((r) => r.json());
        if (!keyRes || !keyRes.key) return;
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        const want = urlBase64ToUint8Array(keyRes.key);
        if (sub) {
          const have = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
          const same = have && have.length === want.length && have.every((v, i) => v === want[i]);
          if (same && pushOn) return;
          if (!same) { try { await sub.unsubscribe(); } catch {} sub = null; }
        }
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
        const { body } = await post("/api/subscribe", { token: getToken(), subscription: sub.toJSON() });
        if (body && body.ok) { setPushUI(true); giveTokenToWorker(); }
      } catch {}
    }

        return msg(errText("unsupported"));
      }
      try {
        msg(T().enabling, true);
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return msg(errText("perm"));
        const reg = await navigator.serviceWorker.ready;
        const keyRes = await fetch("/api/vapid-key").then((r) => r.json());
        if (!keyRes || !keyRes.key) return msg(errText("server"));
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(keyRes.key) });
        }
        const { body } = await post("/api/subscribe", { token: getToken(), subscription: sub.toJSON() });
        if (!body.ok) return msg(errText(body.code));
        setPushUI(true);

        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }

    function renderShift() {

      if (!rider || !shiftLoaded) { box.innerHTML = ""; return; }
      if (!sh) {
        box.innerHTML = `<div class="shift"><div class="sh-k">${esc(X.sh_title)}</div><div class="sh-m">${esc(X.sh_none)}</div><button type="button" class="btn quiet" id="shiftSet">${esc(X.sc_title)}</button></div>`;

      }
      const n = Math.abs(sh.mins);
      const when = sh.mins > 0 ? X.sh_in : sh.mins === 0 ? X.sh_now : X.sh_started;
      let cls = "", body = "";
      if (sh.confirmed) {
        cls = "ok";

      } else if (sh.can_confirm) {

        body = `<div class="sh-m">${esc(late ? X.sh_late_warn : X.sh_open)}</div><button type="button" class="btn ${late ? "danger-fill" : "amber"}" id="shiftBtn">${esc(X.sh_btn)}</button>`;

    async function confirmShift() {

      try {
        const { status, body } = await post("/api/shift/confirm", { token: getToken() });
        if (status === 401) { store.del("riderToken"); showLogin(); return msg(errText("session")); }
        if (!body.ok) { msg(body.code === "too_early" ? T().x.sh_early : errText(body.code)); return; }
        shiftInfo = body.shift;
        syncNotification();
        msg(T().x.sh_done);
      } catch {
        msg(errText("network"));
      } finally {
        renderShift();
      }
    }

    /* ===================== My shifts tab ===================== */
    let schData = null, schDay = null, schScope = "day";
    const LOCALE = { ar: "ar", ur: "ur", bn: "bn", en: "en-GB" };
    const dayLabel = (d, opt) => new Date(d + "T00:00:00Z").toLocaleDateString(LOCALE[lang] || "en-GB", { timeZone: "UTC", ...opt });
    async function loadSch() {
      try {
        const { status, body } = await post("/api/schedule", { token: getToken() });
        if (status === 401) { store.del("riderToken"); showLogin(); return msg(errText("session")); }
        if (body.ok) {
          const first = !schData;
          schData = body;
          if (!schDay || !body.days.some((x) => x.day === schDay)) schDay = body.today;
          if (curTab === "sch" && (first || !$("schPane").contains(document.activeElement))) renderSch();
        } else if (!schData) msg(errText(body.code));
      } catch {
        if (!schData) msg(errText("offline"));
      }
    }
    // 24-hour time picker (a native <input type=time> shows AM/PM on many phones)
    function t24(key, val) {
      const v = val && val.length === 4 ? "0" + val : val || "";
      let o = '<option value="">--:--</option>', found = !v;
      for (let m = 0; m < 1440; m += 5) {
        const t = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
        if (t === v) found = true;
        o += `<option value="${t}"${t === v ? " selected" : ""}>${t}</option>`;
      }
      if (!found) o += `<option value="${esc(v)}" selected>${esc(v)}</option>`;
      return `<select class="t24" data-k="${key}">${o}</select>`;
    }
    function renderSch() {
      const pane = $("schPane"), X = T().x;
      if (!schData) { pane.innerHTML = `<div class="empty">${esc(T().loading)}</div>`; return; }
      const cur = schData.days.find((x) => x.day === schDay) || schData.days[0];
      const chips = schData.days.map((x) => `<button type="button" data-day="${x.day}" aria-pressed="${x.day === schDay}">${esc(dayLabel(x.day, { weekday: "short" }))}<small>${esc(x.day === schData.today ? X.sc_today : dayLabel(x.day, { day: "numeric", month: "short" }))}</small></button>`).join("");
      const rows = [0, 1, 2].map((i) => {
        const sl = cur.slots[i] || { start: "", end: "" };
        return `<div class="slot"><b>${esc(X.sc_slot.replace("{n}", i + 1))}</b><label>${esc(X.sc_from)}${t24(`s${i}`, sl.start)}</label><label>${esc(X.sc_to)}${t24(`e${i}`, sl.end)}</label></div>`;
      }).join("");
      const week = schData.days.map((x) => `<div><span>${esc(dayLabel(x.day, { weekday: "long", day: "numeric", month: "short" }))}</span><span class="t">${x.slots.length ? esc(x.slots.map((q) => q.start + "-" + q.end).join("  |  ")) : esc(X.sc_off)}</span></div>`).join("");
      pane.innerHTML = `<div class="sect" style="margin-top:2px">${esc(X.sc_title)}</div><p class="muted" style="margin:-6px 2px 12px;font-size:14px">${esc(X.sc_sub)}</p>
        <div class="days">${chips}</div>
        <div class="card">${rows}
          <div class="scope"><label><input type="radio" name="scope" value="day" ${schScope === "day" ? "checked" : ""}>${esc(X.sc_scope_day)}</label><label><input type="radio" name="scope" value="week" ${schScope === "week" ? "checked" : ""}>${esc(X.sc_scope_week)}</label></div>
          <button type="button" class="btn" id="schSave">${esc(X.sc_save)}</button></div>
        <div class="sect">${esc(X.sc_week)}</div><div class="wk">${week}</div>`;
      pane.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => { schDay = b.dataset.day; renderSch(); }));
      pane.querySelectorAll("input[name=scope]").forEach((r) => r.addEventListener("change", () => { schScope = r.value; }));
      $("schSave").addEventListener("click", saveSch);
    }
    async function saveSch() {
      const pane = $("schPane");
      const slots = [0, 1, 2].map((i) => ({ start: pane.querySelector(`[data-k=s${i}]`).value, end: pane.querySelector(`[data-k=e${i}]`).value }));
      const b = $("schSave"); b.disabled = true;
      try {
        const { status, body } = await post("/api/schedule/save", { token: getToken(), day: schDay, scope: schScope, slots });
        if (status === 401) { store.del("riderToken"); showLogin(); return msg(errText("session")); }
        if (!body.ok) return msg(body.code === "bad_slots" ? T().x.sc_bad : errText(body.code));
        msg(T().x.sc_saved);
        await loadSch(); renderSch();
        refresh();
      } catch {
        msg(errText("network"));
      } finally {
        if ($("schSave")) $("schSave").disabled = false;
      }
    }

    /* ===================== Incentives tab ===================== */
    let incData = null;
    async function loadInc() {
      const asked = lang;
      try {
        const { status, body } = await post("/api/incentives", { token: getToken(), lang: asked });
        if (status === 401) { store.del("riderToken"); showLogin(); return msg(errText("session")); }
        if (body.ok) { incData = { cards: body.cards || [], reqLang: asked }; if (curTab === "inc") renderInc(); }
      } catch {
        if (!incData) msg(errText("offline"));
      }
    }
    function incCard(c) {
      const color = /^#[0-9a-fA-F]{6}$/.test(c.color || "") ? c.color : "#f59e0b";
      const lines = (c.lines || []).length ? `<ul class="inc-l">${c.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : "";
      const formulas = (c.formulas || []).map((f) => `<div class="inc-f" dir="auto">${esc(f)}</div>`).join("");
      let table = "";
      if (c.table && c.table.head && c.table.rows) {
        table = `<div class="inc-t"><table><thead><tr>${c.table.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.table.rows.map((r) => `<tr>${r.map((v) => `<td dir="${/^[\d\s.,%+*/()=x\u00d7\u2013-]*$/.test(v) ? "ltr" : "auto"}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      return `<section class="inc" style="--ic:${color}"><div class="inc-h"><span class="inc-i">${esc(c.icon || "🎁")}</span><h3>${esc(c.title)}</h3></div>
        ${c.intro ? `<p class="inc-p">${esc(c.intro)}</p>` : ""}${lines}${formulas}${table}${c.note ? `<p class="inc-n">${esc(c.note)}</p>` : ""}</section>`;
    }
    function renderInc() {
      const pane = $("incPane"), X = T().x;
      if (!incData) { pane.innerHTML = `<div class="empty">${esc(T().loading)}</div>`; return; }
      if (!incData.cards.length) { pane.innerHTML = `<div class="empty">${esc(X.inc_none)}</div>`; return; }
      pane.innerHTML = `<div class="sect" style="margin-top:2px">${esc(X.inc_title)}</div><p class="muted" style="margin:-6px 2px 12px;font-size:14px">${esc(X.inc_sub)}</p>` + incData.cards.map(incCard).join("");
    }

    async function loadPerf() {
      try {
        const { status, body } = await post("/api/performance", { token: getToken() });
        if (status === 401) { store.del("riderToken"); showLogin(); return msg(errText("session")); }
        if (body.ok) { perfData = body; renderPerf(); }
      } catch {
        if (!perfData) msg(errText("offline"));
      }
    }

    function changeCard(d, seg, P) {
      const C = P.ch;
      const prev = String(d.prev_segment ?? "").trim();
      if (!prev || ["nan", "none", "—"].includes(prev.toLowerCase())) return `<div class="change none">${esc(C.none)}</div>`;
      const cur = seg.toUpperCase(), pv = prev.toUpperCase();
      let dir = "same";
      if (cur !== pv && SEG_ORDER.includes(cur) && SEG_ORDER.includes(pv)) dir = SEG_ORDER.indexOf(cur) < SEG_ORDER.indexOf(pv) ? "up" : "down";
      let why = "";
      if (dir === "down") {
        let items = "";
        for (const [ck, pk, target, lk] of TARGETS) {
          const val = numOrNull(d[ck]);
          if (val !== null && val < target - 1e-9) {
            const old = numOrNull(d[pk]);
            items += `<li><strong>${esc(P[lk])}</strong>: ${pct2(val)} (${esc(C.target)} ${target}%)${old !== null ? ` — ${esc(C.was)} ${pct2(old)}` : ""}</li>`;
          }
        }
        why = items ? `<div class="why">${esc(C.reason)}<ul>${items}</ul></div>` : `<div class="why">${esc(C.generic)}</div>`;
      }
      const big = dir === "same" ? esc(seg) : `${esc(prev)} → ${esc(seg)}`;
      return `<div class="change ${dir}"><div class="t">${esc(C[dir])}</div><div class="big">${big}</div><div class="s">${esc(C.prev)}: ${esc(prev)}</div>${why}</div>`;
    }

    function targetCard(d, P) {
      const t = parseInt(d.target_per_day) || 0, days = parseInt(d.days_covered) || 0, orders = parseInt(d.orders) || 0;
      if (t <= 0 || days <= 0) return "";
      const G = P.tg, expected = t * days, missing = Math.max(expected - orders, 0), ok = missing === 0;
      const stats = [[G.yours, orders.toLocaleString("en-US")], [G.required, expected.toLocaleString("en-US")]];
      if (!ok) stats.push([G.missing, missing.toLocaleString("en-US")]);
      return `<div class="target ${ok ? "ok" : "bad"}"><div class="tt">${esc(G.title)}</div><div class="st">${esc(ok ? G.ok : G.warn)}</div>
        <div class="tgrid">${stats.map(([l, v], i) => `<div><b${!ok && i === 2 ? ' style="color:var(--red)"' : ""}>${v}</b><small>${esc(l)}</small></div>`).join("")}</div>
        <div class="ln">${esc(G.line.replace("{t}", t).replace("{d}", days).replace("{e}", expected.toLocaleString("en-US")))}</div></div>`;
    }

    function tipsCard(K, P) {
      if (!K) return "";
      const goals = [[P.verification, "100%"], [P.fail, "100%"], [P.on_time, "98%"]];
      const steps = (K.steps || []).map(([title, lines], i) => {
        const body = (lines || []).map((l) => l.startsWith(">") ? `<div class="quote">${esc(l.slice(1).trim())}</div>` : `<div class="ln">${esc(l)}</div>`).join("");
        return `<div class="tstep"><div class="no">${i + 1}</div><div><div class="h">${esc(title)}</div>${body}</div></div>`;
      }).join("");
      const img = perfData && perfData.image ? `<img class="tipimg" src="/api/tips-image?v=${perfData.imgv || 1}" alt=""><div class="tipcap">${esc(K.img)}</div>` : "";
      return `<div class="tips"><div class="tt">💡 ${esc(K.title)}</div><div>${esc(K.intro)}</div>
        <div class="goals">${goals.map(([l, v]) => `<div class="goal"><b>${v}</b><small>${esc(l)}</small></div>`).join("")}</div>
        <div class="tnote">${esc(K.note)}</div><div class="sect" style="margin-top:6px">${esc(K.howto)}</div>${steps}
        <div class="avoid"><strong>🚫 ${esc(K.avoid_title)}</strong><br>${esc(K.avoid)}</div>
        <div class="closing">${esc(K.closing)}</div>${img}</div>`;
    }

    function renderPerf() {
      const pane = $("perfPane"), P = T().perf;
      if (!perfData) { pane.innerHTML = `<div class="empty">${esc(T().loading)}</div>`; return; }
      const d = perfData.perf;
      if (!d) { pane.innerHTML = `<div class="empty">${esc(P.none)}</div>`; return; }
      let seg = String(d.segment ?? "").trim();
      if (!seg || ["nan", "none"].includes(seg.toLowerCase())) seg = "—";
      const color = SEG_COLOR[seg.toUpperCase()] || "#64748b";
      const name = (d.rider_name || "").trim() || P.rider;
      const cards = [[P.orders, int0(d.orders)], [P.in_time, int0(d.orders_in_time)], [P.late, int0(d.late_orders)], [P.acceptance, pct2(d.acceptance_rate)],
        [P.on_time, pct2(d.on_time_rate)], [P.verification, pct2(d.verification_rate)], [P.fail, pct2(d.fail_rate)], [P.final, pct2(d.final_score)], [P.seg, seg, color]];
      pane.innerHTML =
        `<div class="profile"><div class="nm">${esc(name)}</div><div class="pid">${esc(P.idl)}: ${esc(d.rider_id)}</div>
          <div class="sl">${esc(P.seg)}</div><div class="segpill" style="background:${color}">${esc(seg)}</div></div>` +
        changeCard(d, seg, P) + targetCard(d, P) +
        `<div class="sect">${esc(P.overview)}</div><div class="mgrid">${cards.map(([l, v, c]) => `<div class="metric"><div class="l">${esc(l)}</div><div class="v"${c ? ` style="color:${c}"` : ""}>${esc(v)}</div></div>`).join("")}</div>` +
        tipsCard((perfData.tips || {})[lang], P) + `<div class="foot">${esc(P.footer)}</div>`;
    }

    /* ===================== Start ===================== */
    // Buttons on the notification open the app with ?do=action (or the worker posts a message)
    let pendingDo = null;
    function takeDo() {
      try {
        const u = new URL(location.href);
        const a = u.searchParams.get("do");
        if (a) { pendingDo = a; history.replaceState(null, "", u.pathname); }
      } catch {}
    }
    function runPendingDo() {
      if (!pendingDo || !getToken()) return;
      const a = pendingDo;
      pendingDo = null;
      if (a === "shift_ok") { setTab("orders"); return; }
      // only run steps that are valid right now, otherwise just show the screen
      const stage = last.order ? last.order.stage : null;
      const ok =
        (a === "have_order" && !last.order) || a === "no_order" ||
        (a === "arrived" && stage === "declared") ||
        (a === "picked_up" && (stage === "declared" || stage === "arrived")) ||
        (a === "delivered" && !!stage);
      if (ok) act(a);
    }

    (async function init() {
      takeDo();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data && e.data.type === "do") { pendingDo = e.data.action; refresh().then(runPendingDo); }
        });
      }
      applyLang();
      if (getToken()) {
        let cached = null;
        try { cached = JSON.parse(store.get("riderInfo")); } catch {}
        if (cached && cached.id) { showHome(cached); render({ order: null, prompt: null }); }
        $("statusTitle").textContent = T().loading;
        await refresh();
        runPendingDo();
      } else {
        showLogin();
      }
      setInterval(() => { if (!document.hidden) refresh(); }, 30000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    })();
  </script>
</body>
</html>
