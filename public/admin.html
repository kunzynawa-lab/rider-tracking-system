<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link · Admin</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg: #f4f6f9; --surface: #fff; --text: #0f1b2d; --muted: #5d6b7e; --line: #e3e8ef;
      --brand: #0f766e; --brand-d: #0b5d57; --brand-soft: #e3f4f2;
      --idle: #64748b; --idle-soft: #eef1f5;
      --amber: #b45309; --amber-soft: #fef3c7;
      --violet: #6d28d9; --violet-soft: #ede9fe;
      --blue: #1d4ed8; --blue-soft: #dbeafe;
      --green: #15803d; --green-soft: #dcfce7;
      --red: #b42318; --red-soft: #fee4e2;
      --shadow: 0 1px 2px rgba(15,27,45,.05), 0 6px 20px rgba(15,27,45,.05);
      --side: 232px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --surface: #121b2c; --text: #eaf0f7; --muted: #94a3b8; --line: #233046;
        --brand: #2dd4bf; --brand-d: #14b8a6; --brand-soft: #0f2e2e;
        --idle: #94a3b8; --idle-soft: #1b2638;
        --amber: #fbbf24; --amber-soft: #3a2a08; --violet: #a78bfa; --violet-soft: #271f47;
        --blue: #60a5fa; --blue-soft: #14284d; --green: #4ade80; --green-soft: #0f2f1c;
        --red: #f87171; --red-soft: #3a1514; --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.5 Inter, "Noto Sans Arabic", system-ui, Tahoma, sans-serif; }
    .hidden { display: none !important; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    h1 { font-size: 22px; margin: 0; } h2 { font-size: 15px; margin: 0; } h3 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); } .num { font-variant-numeric: tabular-nums; }

    #gate { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .gate-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); }
    .gate-card img { width: 52px; height: 52px; border-radius: 14px; }
    input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
    input:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
    .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--brand-d); color: #fff; min-height: 40px; }
    @media (prefers-color-scheme: dark) { .btn:not(.ghost) { color: #04201d; background: var(--brand); } }
    .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
    .btn.sm { padding: 5px 10px; min-height: 30px; font-size: 13px; }
    .btn:disabled { opacity: .55; }
    .err { color: var(--red); font-size: 13.5px; min-height: 20px; margin-top: 8px; }

    #app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
    aside { background: var(--surface); border-inline-end: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; padding: 4px 8px 16px; }
    .logo img { width: 32px; height: 32px; border-radius: 9px; }
    nav { display: grid; gap: 4px; }
    nav button { display: flex; align-items: center; gap: 10px; text-align: start; width: 100%; background: transparent; border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 600; color: var(--muted); }
    nav button[aria-current=page] { background: var(--brand-soft); color: var(--brand-d); }
    @media (prefers-color-scheme: dark) { nav button[aria-current=page] { color: var(--brand); } }
    .side-foot { margin-top: auto; display: grid; gap: 8px; }
    .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; font-weight: 600; color: var(--muted); font-size: 13px; }
    .seg button[aria-pressed=true] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    main { padding: 22px 26px 40px; min-width: 0; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .head .sub { color: var(--muted); font-size: 13px; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-inline-end: 6px; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(21,128,61,.5);} 100% { box-shadow: 0 0 0 8px rgba(21,128,61,0);} }
    @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { padding: 14px 16px; }
    .kpi.click { cursor: pointer; transition: transform .12s, box-shadow .12s; }
    .kpi.click:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,27,45,.14); }
    .kpi .v { font-size: 26px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
    .kpi .s { font-size: 12.5px; color: var(--muted); }
    .kpi.warn .v { color: var(--red); } .kpi.good .v { color: var(--green); }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
    .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
    .card { min-width: 0; }

    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
    .b-idle { background: var(--idle-soft); color: var(--idle); } .b-declared { background: var(--amber-soft); color: var(--amber); }
    .b-arrived { background: var(--violet-soft); color: var(--violet); } .b-picked_up { background: var(--blue-soft); color: var(--blue); }
    .b-late { background: var(--red-soft); color: var(--red); } .b-green { background: var(--green-soft); color: var(--green); }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 13px; color: var(--muted); }
    .chip[aria-pressed=true] { background: var(--brand-d); border-color: var(--brand-d); color: #fff; }
    @media (prefers-color-scheme: dark) { .chip[aria-pressed=true] { background: var(--brand); color: #04201d; border-color: var(--brand); } }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: start; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--bg); }
    .scroll { overflow: auto; max-height: 460px; }
    .rname { font-weight: 600; } .rid { color: var(--muted); font-size: 12px; }
    .bar { height: 6px; border-radius: 3px; background: var(--idle-soft); overflow: hidden; min-width: 70px; }
    .bar > i { display: block; height: 100%; border-radius: 3px; }

    .idle-list { display: grid; }
    .idle-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: center; }
    .idle-row:last-child { border-bottom: 0; }
    .idle-row .bar { grid-column: 1 / -1; }
    .idle-row .dur { font-weight: 700; }
    .sev-ok { color: var(--green); } .sev-mid { color: var(--amber); } .sev-hi { color: var(--red); }
    .idle-sum { display: flex; gap: 20px; flex-wrap: wrap; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 13px; }
    .idle-sum b { font-size: 15px; }
    .empty { padding: 26px 16px; text-align: center; color: var(--muted); }

    #map { height: min(62vh, 560px); min-height: 380px; border-radius: 0 0 14px 14px; z-index: 0; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; color: #fff; }
    .pin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.45); display: grid; place-items: center; font-size: 18px; line-height: 1; }
    .pin.late { box-shadow: 0 0 0 3px #d92d20, 0 2px 6px rgba(0,0,0,.45); }
    .pin-label { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); background: rgba(15,27,45,.85); color: #fff; font: 600 11px/1.3 Inter, sans-serif; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }

    .feed { max-height: 320px; overflow: auto; }
    .feed ul { list-style: none; margin: 0; padding: 0; }
    .feed li { display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
    .feed time { color: var(--muted); font-size: 12px; min-width: 44px; direction: ltr; }

    .chart { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding: 8px 16px 8px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
    .chart .col i { width: 100%; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .9; }
    .chart .col span { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .chart .col em { font-size: 10px; font-style: normal; color: var(--muted); }
    .funnel { display: grid; gap: 10px; padding: 14px 16px; }
    .funnel .f { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
    .funnel .bar { height: 10px; }

    dialog { border: 0; border-radius: 16px; padding: 22px; width: min(480px, 92vw); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    dialog::backdrop { background: rgba(8,15,28,.55); }
    .toast { position: fixed; bottom: 20px; inset-inline-start: 50%; transform: translateX(-50%); background: #0f1b2d; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 50; }

    /* shifts */
    .shgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .shcard.alert { border-color: var(--red); }
    .shcard .bd { padding: 14px 16px; display: grid; gap: 12px; }
    .sups { display: flex; gap: 6px; flex-wrap: wrap; }
    .stack-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--idle-soft); }
    .stack-bar i { display: block; height: 100%; }
    .cnts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
    .cnts b { font-size: 16px; }
    select.rsup { width: auto; min-width: 120px; padding: 5px 8px; font-size: 13px; }
    .cbtn { border: 1px solid var(--line, #d7dde5); background: transparent; color: inherit; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
    .cbtn.on { background: var(--brand-soft); border-color: var(--brand); }
    .rl { border-top: 1px solid var(--line); margin: 0 -16px -14px; max-height: 320px; overflow: auto; }
    .rl table th, .rl table td { padding: 7px 14px; white-space: normal; }
    .h2row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 10px; flex-wrap: wrap; }
    .code { font: 700 14px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.5px; background: var(--bg); border: 1px dashed var(--line); padding: 5px 8px; border-radius: 8px; direction: ltr; display: inline-block; }
    .check { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-weight: 600; }
    .check input { width: auto; }
    /* incentives editor */
    .icard { padding: 16px; margin-bottom: 14px; display: grid; gap: 10px; }
    .icard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .icard .two { display: grid; grid-template-columns: 90px 90px 1fr; gap: 10px; }
    .icard label > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
    .icard input[type=color] { padding: 2px; height: 42px; }
    .icard textarea { font-family: inherit; }
    .icard textarea.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

    @media (max-width: 1180px) { .grid2 { grid-template-columns: 1fr; } }
    @media (max-width: 960px) {
      #app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-inline-end: 0; border-bottom: 1px solid var(--line); }
      .logo { padding: 0 8px 0 0; } nav { display: flex; order: 3; width: 100%; overflow: auto; }
      nav button { width: auto; white-space: nowrap; padding: 8px 12px; }
      .side-foot { margin: 0 0 0 auto; display: flex; align-items: center; }
      main { padding: 16px 14px 36px; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="gate" class="hidden">
    <form class="gate-card" id="gateForm">
      <img src="/icon-192.png" alt="">
      <h1 style="margin:14px 0 4px" data-i="gateTitle"></h1>
      <p class="muted" style="margin:0 0 16px" data-i="gateSub"></p>
      <label for="keyInput" style="font-weight:600;display:block;margin-bottom:6px" data-i="adminKey"></label>
      <input id="keyInput" type="password" autocomplete="current-password" dir="ltr" required>
      <div class="err" id="gateErr" role="alert"></div>
      <button class="btn" style="width:100%;margin-top:8px" type="submit" data-i="signIn"></button>
      <div class="seg" style="margin-top:16px"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="ar" aria-pressed="false">العربية</button></div>
    </form>
  </section>

  <div id="app" class="hidden">
    <aside>
      <div class="logo"><img src="/icon-192.png" alt=""><span data-i="brand"></span></div>
      <nav id="nav">
        <button data-page="live" aria-current="page">📍 <span data-i="navLive"></span></button>
        <button data-page="reports">📊 <span data-i="navReports"></span></button>
        <button data-page="riders">👥 <span data-i="navRiders"></span></button>
        <button data-page="performance">🏆 <span data-i="navPerf"></span></button>
        <button data-page="shifts">🗓️ <span data-i="navShifts"></span></button>
        <button data-page="incentives">🎁 <span data-i="navInc"></span></button>
      </nav>
      <div class="side-foot">
        <div class="seg" id="langSeg"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="ar" aria-pressed="false">عربي</button></div>
        <button class="btn ghost sm" id="signOut" data-i="signOut"></button>
      </div>
    </aside>

    <main>
      <section id="pg-live">
        <div class="head">
          <div><h1 data-i="liveTitle"></h1><div class="sub"><span class="live-dot"></span><span id="updated"></span></div></div>
          <div class="chips" id="filters"></div>
          <button class="btn ghost sm" id="diagBtn" data-i="diagBtn"></button>
        </div>
        <div class="kpis" id="liveKpis"></div>
        <div class="card" style="margin-bottom:16px">
          <header><h2 data-i="map"></h2><span class="muted" id="mapCount"></span></header>
          <div class="legend" id="legend"></div>
          <div id="map"></div>
        </div>
        <div class="grid2">
          <div class="stack">
            <div class="card">
              <header><h2 data-i="idleBoard"></h2><span class="badge b-idle" id="idleCount"></span></header>
              <div class="idle-sum" id="idleSum"></div>
              <div class="idle-list scroll" id="idleList"></div>
            </div>
            <div class="card">
              <header><h2 data-i="allRiders"></h2><span class="muted" id="listCount"></span></header>
              <div class="scroll"><table><thead><tr id="ridersHead"></tr></thead><tbody id="ridersBody"></tbody></table></div>
            </div>
          </div>
          <div class="stack">
            <div class="card"><header><h2 data-i="activity"></h2></header><div class="feed"><ul id="feed"></ul></div></div>
          </div>
        </div>
      </section>

      <section id="pg-reports" class="hidden">
        <div class="head">
          <div><h1 data-i="reportsTitle"></h1><div class="sub" id="rangeLabel"></div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div class="chips" id="ranges"></div>
            <button class="btn ghost sm" id="exportRiders" data-i="exportRiders"></button>
            <button class="btn ghost sm" id="exportOrders" data-i="exportOrders"></button>
          </div>
        </div>
        <div class="kpis" id="repKpis"></div>
        <div class="grid2" style="margin-bottom:16px">
          <div class="card"><header><h2 data-i="byHour"></h2></header><div class="chart" id="hourChart"></div></div>
          <div class="card"><header><h2 data-i="funnel"></h2></header><div class="funnel" id="funnel"></div></div>
        </div>
        <div class="card" id="dayCard" style="margin-bottom:16px"><header><h2 data-i="byDay"></h2></header><div class="chart" id="dayChart"></div></div>
        <div class="card" style="margin-bottom:16px">
          <header><h2 data-i="riderPerf"></h2></header>
          <div class="scroll"><table><thead><tr id="perfHead"></tr></thead><tbody id="perfBody"></tbody></table></div>
        </div>
        <div class="card">
          <header><h2 data-i="orderLog"></h2><span class="muted" id="orderLogNote"></span></header>
          <div class="scroll"><table><thead><tr id="logHead"></tr></thead><tbody id="logBody"></tbody></table></div>
        </div>
      </section>

      <section id="pg-riders" class="hidden">
        <div class="head">
          <div><h1 data-i="ridersTitle"></h1><div class="sub" id="ridersSub"></div></div>
          <div style="display:flex;gap:8px"><input id="riderSearch" style="width:220px" data-ph="search"><button class="btn" id="addBtn" data-i="addRiders"></button><button class="btn ghost" id="delAllBtn" data-i="delAll"></button></div>
        </div>
        <div class="card"><div class="scroll" style="max-height:none"><table><thead><tr id="mgHead"></tr></thead><tbody id="mgBody"></tbody></table></div></div>
      </section>
      <section id="pg-performance" class="hidden">
        <div class="head">
          <div><h1 data-i="perfTitle"></h1><div class="sub" id="perfSub"></div></div>
          <div class="chips" id="perfTabs"></div>
        </div>

        <div id="pt-upload">
          <div class="card" style="padding:18px;margin-bottom:16px">
            <p class="muted" style="margin:0 0 12px" data-i="perfWarn"></p>
            <label class="btn ghost" style="display:inline-flex;cursor:pointer"><span data-i="chooseSheet"></span><input id="perfFile" type="file" accept=".xlsx,.xls,.csv" style="display:none"></label>
            <span class="muted" id="perfFileInfo" style="margin-inline-start:10px"></span>
            <div class="err" id="perfErr" role="alert"></div>
          </div>
          <div id="perfPreview" class="hidden">
            <div class="card" style="padding:18px;margin-bottom:16px">
              <h2 style="margin-bottom:10px" data-i="targetTitle"></h2>
              <div style="display:flex;gap:12px;flex-wrap:wrap">
                <label style="flex:1;min-width:160px"><span class="muted" data-i="tgtPerDay"></span><input id="tgtPerDay" type="number" min="1" value="17"></label>
                <label style="flex:1;min-width:160px"><span class="muted" data-i="daysCovered"></span><input id="daysCovered" type="number" min="1" max="31" value="1"></label>
              </div>
              <p class="muted" id="tgtLine" style="margin:10px 0 0"></p>
            </div>
            <div class="card" style="margin-bottom:16px"><header><h2 data-i="previewT"></h2><span class="muted" id="segCounts"></span></header>
              <div class="scroll" style="max-height:300px"><table><thead><tr id="prevHead"></tr></thead><tbody id="prevBody"></tbody></table></div></div>
            <button class="btn" id="perfGo" data-i="replaceBtn"></button>
            <span class="muted" id="perfProg" style="margin-inline-start:10px"></span>
          </div>
        </div>

        <div id="pt-data" class="hidden">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
            <input id="pdSearch" style="max-width:260px" data-ph="searchPerf">
            <select id="pdSeg" style="max-width:160px"></select>
            <label style="display:flex;gap:6px;align-items:center"><input id="pdBelow" type="checkbox" style="width:auto"><span data-i="belowOnly"></span></label>
            <button class="btn ghost sm" id="pdDownload" data-i="downloadXlsx"></button>
            <span class="muted" id="pdCount"></span>
          </div>

    const m = Math.round(s / 60);

  async function api(path, opts = {}) {
    let res;
    try {
      res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "X-Admin-Key": cleanKey(key), ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
    } catch (e) {
      throw { code: "conn", message: T("e_conn") + (e && e.message ? " (" + e.message + ")" : "") };
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) throw { code: "key", message: T("e_key") };
    if (res.status === 503) throw { code: "missing", message: T("e_missing") };
    if (!res.ok || data.ok === false) throw { code: "generic", message: data.error || T("e_generic") };
    return data;
  }

  function matchFilter(r, f) {
    if (f === "all") return true;
    if (f === "online") return r.online;
    if (f === "sched") return r.scheduled;
    if (f === "sched_off") return r.scheduled && !r.online;

  function renderIdle(o) {
    const now = o.now;
    const idle = o.riders.filter((r) => r.state === "idle")
      .map((r) => ({ ...r, ms: r.idle_since ? Math.max(0, now - r.idle_since) : null }))
      .sort((a, b) => (b.ms ?? -1) - (a.ms ?? -1));
    $("idleCount").textContent = idle.length + " " + T("riders");
    const known = idle.filter((r) => r.ms != null);
    const over60 = known.filter((r) => r.ms >= 3600000).length, over30 = known.filter((r) => r.ms >= 1800000).length;
    $("idleSum").innerHTML = known.length
      ? `<span>${T("sumLongest")}: <b class="num sev-${idleSeverity(o.stats.longest_idle_ms)}">${dur(o.stats.longest_idle_ms)}</b></span>
         <span>${T("sumAvg")}: <b class="num">${dur(o.stats.avg_idle_ms)}</b></span>
         <span>${T("sumOver30")}: <b class="num">${over30}</b></span>
         <span>${T("sumOver60")}: <b class="num ${over60 ? "sev-hi" : ""}">${over60}</b></span>`
      : "";
    $("idleSum").classList.toggle("hidden", !known.length);
    const maxMs = Math.max(3600000, ...known.map((r) => r.ms));
    $("idleList").innerHTML = idle.length
      ? idle.map((r) => {
          const sev = r.ms == null ? "ok" : idleSeverity(r.ms);
          const color = sev === "hi" ? "var(--red)" : sev === "mid" ? "var(--amber)" : "var(--green)";
          const w = r.ms == null ? 0 : Math.max(4, Math.min(100, (r.ms / maxMs) * 100));
          return `<div class="idle-row">
            <div><span class="rname">${esc(r.name || r.id)}</span> <span class="rid">#${esc(r.id)}</span>${r.push ? "" : ` <span class="badge b-late">🔕</span>`}${r.late ? ` <span class="badge b-late">${esc(T("f_late"))}</span>` : ""}</div>
            <div class="dur num sev-${sev}">${r.ms == null ? esc(T("idleUnknown")) : dur(r.ms)}</div>

  function renderRiders(o) {

  function download(name, text) {

    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function rowsToText(rows) {
    const out = [];
    rows.forEach((r, i) => {
      const id = String(r[0] ?? "").replace(/[\u200b-\u200f\u202a-\u202e\ufeff]/g, "").trim();
      if (!id) return;
      if (i === 0 && HEADER.test(id)) return;

  function loadXlsx() {
    if (typeof XLSX !== "undefined") return Promise.resolve();
    return loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  }

  function pctColumn(vals) {
    const hasPct = vals.some((v) => typeof v === "string" && v.includes("%"));
    const nums = vals.map((v) => {
      const n = Number(String(v ?? "").replace("%", "").trim());
      return String(v ?? "").trim() === "" || !isFinite(n) ? 0 : n;
    });
    if (hasPct) return nums;
    const mx = nums.length ? Math.max(...nums) : 0;
    return mx <= 1 ? nums.map((n) => n * 100) : nums;
  }

  function buildClean(headers, data) {
    const byNorm = {};
    headers.forEach((h, i) => { if (!(pnorm(h) in byNorm)) byNorm[pnorm(h)] = i; });
    const map = {};
    for (const [k, aliases] of Object.entries(PFIELDS)) {
      const a = aliases.find((x) => x in byNorm);
      map[k] = a === undefined ? null : byNorm[a];
    }
    const missing = Object.keys(PFIELDS).filter((k) => map[k] === null);
    if (map.rider_id === null) return { map, missing, rows: [] };
    const col = (k) => data.map((r) => r[map[k]]);
    const out = data.map((r) => ({
      rider_id: String(r[map.rider_id] ?? "").trim().replace(/\.0$/, ""),
      rider_name: map.rider_name !== null ? String(r[map.rider_name] ?? "").trim().replace(/^nan$/i, "") : "",
    }));
    for (const k of P_INT) {
      const vals = map[k] !== null ? col(k) : null;
      out.forEach((o, i) => { o[k] = vals ? Math.max(0, Math.trunc(Number(String(vals[i]).replace(/,/g, "")) || 0)) : 0; });
    }
    if (map.late_orders === null) out.forEach((o) => { o.late_orders = Math.max(0, o.orders - o.orders_in_time); });
    for (const k of P_PCT) {
      const vals = map[k] !== null ? pctColumn(col(k)) : null;
      out.forEach((o, i) => { o[k] = vals ? vals[i] : 0; });
    }
    out.forEach((o, i) => {
      const sg = map.segment !== null ? String(data[i][map.segment] ?? "").trim() : "";
      o.segment = sg || "—";
    });
    const seen = new Map();
    out.filter((o) => o.rider_id && o.rider_id.toLowerCase() !== "nan").forEach((o) => seen.set(o.rider_id, o)); // last one wins
    return { map, missing, rows: [...seen.values()] };
  }

  const PCOLS = () => [["rider_id", "colId"], ["rider_name", "colName"], ["orders", "colOrders"], ["orders_in_time", "colInTime"], ["late_orders", "colLate"], ["failed_orders", "colFailed"],
    ["chat_rate", "colChat"], ["acceptance_rate", "colAcc"], ["on_time_rate", "colOnTime"], ["verification_rate", "colVer"], ["fail_rate", "colFail"], ["final_score", "colFinal"], ["segment", "colSeg"]];
  const PCT_SET = new Set(P_PCT);
  const cellFmt = (k, v) => (PCT_SET.has(k) ? Number(v).toFixed(2) + "%" : k === "segment" ? `<b style="color:${SEGC[String(v).toUpperCase()] || "var(--muted)"}">${esc(v)}</b>` : esc(v));

  function renderPerfTabs() {
    $("perfTabs").innerHTML = ["upload", "data", "tips"].map((t) => `<button class="chip" data-t="${t}" aria-pressed="${t === perfTab}">${esc(T("pt_" + t))}</button>`).join("");
    $("perfTabs").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { perfTab = b.dataset.t; showPerfTab(); }));
    ["upload", "data", "tips"].forEach((t) => $("pt-" + t).classList.toggle("hidden", t !== perfTab));
  }
  function showPerfTab() {
    renderPerfTabs();
    if (perfTab === "data") loadPerfData();
    if (perfTab === "tips") loadTips();
  }
  function initPerf() {
    if (!perfInited) {
      perfInited = true;
      $("daysCovered").value = Math.max(new Date().getDate() - 1, 1);
    }
    showPerfTab();
    loadPerfData(true);

  $("perfFile").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    $("perfErr").textContent = ""; $("perfPreview").classList.add("hidden"); perfRows = null;
    try {
      await loadXlsx();
      const wb = f.name.toLowerCase().endsWith(".csv") ? XLSX.read(await f.text(), { type: "string" }) : XLSX.read(await f.arrayBuffer(), { type: "array" });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" }).filter((r) => r.some((c) => String(c).trim() !== ""));
      const headers = aoa[0] || [], data = aoa.slice(1);
      $("perfFileInfo").textContent = T("rowsLoaded", { r: data.length, c: headers.length });
      const res = buildClean(headers, data);
      if (res.map.rider_id === null || res.missing.length) {
        $("perfErr").textContent = T("missingCols") + res.missing.join(", ");
        return;
      }
      perfRows = res.rows;
      const segs = {};
      perfRows.forEach((r) => { segs[r.segment] = (segs[r.segment] || 0) + 1; });
      $("segCounts").textContent = Object.entries(segs).map(([k, v]) => k + ": " + v).join(" | ");
      $("prevHead").innerHTML = PCOLS().map(([, l]) => `<th>${esc(T(l))}</th>`).join("");
      $("prevBody").innerHTML = perfRows.slice(0, 15).map((r) => "<tr>" + PCOLS().map(([k]) => `<td class="num">${cellFmt(k, r[k])}</td>`).join("") + "</tr>").join("");
      updTgt();
      $("perfPreview").classList.remove("hidden");
    } catch (err) {
      $("perfErr").textContent = T("e_generic") + (err && err.message ? " (" + err.message + ")" : "");

  function updTgt() {

    $("tgtLine").textContent = T("tgtLine", { t, d, e: t * d });
  }
  $("tgtPerDay").addEventListener("input", updTgt);
  $("daysCovered").addEventListener("input", updTgt);

  $("perfGo").addEventListener("click", async () => {
    if (!perfRows || !perfRows.length) return;
    if (!confirm(T("confirmReplace"))) return;
    const tpd = Math.max(1, +$("tgtPerDay").value || 1), days = Math.min(31, Math.max(1, +$("daysCovered").value || 1));
    $("perfGo").disabled = true; $("perfErr").textContent = "";
    let inserted = 0, skipped = 0;
    try {
      for (let i = 0; i < perfRows.length; i += 100) {
        $("perfProg").textContent = T("uploading", { n: Math.min(i + 100, perfRows.length), t: perfRows.length });
        const r = await api("/api/admin/performance/upload", { method: "POST", body: JSON.stringify({ first: i === 0, rows: perfRows.slice(i, i + 100), target_per_day: tpd, days_covered: days }) });
        inserted += r.inserted; skipped += r.skipped;
      }
      $("perfProg").textContent = "";
      toast(T("uploadedOk", { n: inserted, s: skipped }));
      $("perfPreview").classList.add("hidden"); $("perfFileInfo").textContent = ""; perfRows = null;
      perfTab = "data"; showPerfTab();
    } catch (err) { $("perfProg").textContent = ""; if (err.code === "key" || err.code === "missing") handleErr(err); else $("perfErr").textContent = err.message; }
    finally { $("perfGo").disabled = false; }

  async function loadPerfData(metaOnly) {
    try {
      perfList = await api("/api/admin/performance");
      const m = perfList.meta;
      $("perfSub").textContent = m.count ? T("lastUpload", { t: new Date(m.uploaded_at).toLocaleString("en-GB", { timeZone: "Asia/Riyadh", dateStyle: "medium", timeStyle: "short" }), n: m.count }) : T("noPerf");
      if (!metaOnly) renderPerfData();
    } catch (e) { handleErr(e); }
  }
  function renderPerfData() {
    if (!perfList) return;
    const all = perfList.rows;
    const segs = [...new Set(all.map((r) => String(r.segment || "—")))].sort();
    const cur = $("pdSeg").value;
    $("pdSeg").innerHTML = `<option value="">${esc(T("allSegs"))}</option>` + segs.map((s) => `<option${s === cur ? " selected" : ""}>${esc(s)}</option>`).join("");
    const q = $("pdSearch").value.trim().toLowerCase(), sg = $("pdSeg").value, below = $("pdBelow").checked;
    const miss = (r) => (r.target_per_day > 0 && r.days_covered > 0 ? Math.max(r.target_per_day * r.days_covered - r.orders, 0) : null);
    const rows = all.filter((r) => (!q || String(r.rider_id).toLowerCase().includes(q) || String(r.rider_name || "").toLowerCase().includes(q)) && (!sg || String(r.segment || "—") === sg) && (!below || miss(r) > 0));

    $("pdBody").innerHTML = rows.length

      : `<tr><td colspan="14" class="empty">${esc(T("noPerf"))}</td></tr>`;

  ["pdSearch", "pdSeg", "pdBelow"].forEach((id) => $(id).addEventListener("input", renderPerfData));
  $("pdDownload").addEventListener("click", async () => {
    const rows = renderPerfData.rows || [];
    if (!rows.length) return;
    await loadXlsx();
    const out = rows.map((r) => Object.fromEntries(PCOLS().map(([k, l]) => [T(l), PCT_SET.has(k) ? Math.round(r[k] * 100) / 100 : r[k]])));
    const ws = XLSX.utils.json_to_sheet(out), wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Riders");
    XLSX.writeFile(wb, "rider_performance_" + new Date().toISOString().slice(0, 10) + ".xlsx");
  });

  /* ----- tips editor ----- */
  const TIP_FIELDS = ["title", "intro", "note", "howto", "avoid_title", "avoid", "closing", "img"];
  function stepsToText(steps) { return (steps || []).map(([t, ls]) => "## " + t + "\n" + ls.join("\n")).join("\n\n"); }
  function textToSteps(txt) {
    const steps = []; let cur = null;
    for (const raw of txt.split(/\r?\n/)) {
      const l = raw.replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, "").trimEnd();
      if (l.startsWith("## ")) { cur = [l.slice(3).trim(), []]; steps.push(cur); }
      else if (l.trim()) { if (!cur) { cur = ["", []]; steps.push(cur); } cur[1].push(l.trim()); }
    }
    return steps;
  }
  async function loadTips() {
    try { tipsData = await api("/api/admin/tips"); renderTips(); } catch (e) { handleErr(e); }
  }
  function renderTips() {
    if (!tipsData) return;
    $("tipLangs").innerHTML = ["en", "ar", "ur", "bn"].map((l) => `<button class="chip" data-l="${l}" aria-pressed="${l === tipLang}">${{ en: "English", ar: "العربية", ur: "اردو", bn: "বাংলা" }[l]}</button>`).join("");
    $("tipLangs").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { tipLang = b.dataset.l; renderTips(); }));
    const t = tipsData.tips[tipLang], rtl = tipLang === "ar" || tipLang === "ur";
    $("tipCustom").classList.toggle("hidden", !tipsData.custom[tipLang]);
    $("tipForm").innerHTML =
      TIP_FIELDS.map((k) => `<label><span class="muted">${esc(T("f_" + k))}</span><input data-k="${k}" dir="${rtl ? "rtl" : "ltr"}" value="${esc(t[k])}"></label>`).join("") +
      `<label><span class="muted">${esc(T("f_steps"))}</span><textarea id="tipSteps" rows="14" dir="${rtl ? "rtl" : "ltr"}">${esc(stepsToText(t.steps))}</textarea></label>
       <div class="muted" style="font-size:12.5px">${esc(T("f_stepsHelp"))}</div>`;
    const img = $("tipImgPrev");
    img.classList.toggle("hidden", !tipsData.image);
    if (tipsData.image) img.src = "/api/tips-image?t=" + Date.now();
    $("tipImgRemove").classList.toggle("hidden", !tipsData.image);
  }
  $("tipSave").addEventListener("click", async () => {
    const tip = {};
    $("tipForm").querySelectorAll("input[data-k]").forEach((i) => { tip[i.dataset.k] = i.value; });
    tip.steps = textToSteps($("tipSteps").value);
    try { await api("/api/admin/tips", { method: "POST", body: JSON.stringify({ lang: tipLang, tip }) }); toast(T("tipsSaved")); loadTips(); } catch (e) { handleErr(e); }
  });
  $("tipReset").addEventListener("click", async () => {
    try { await api("/api/admin/tips", { method: "POST", body: JSON.stringify({ lang: tipLang, reset: true }) }); toast(T("tipsReset")); loadTips(); } catch (e) { handleErr(e); }
  });
  $("tipImgFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (f.size > 800 * 1024) return toast(T("imgBig"));
    const dataUrl = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
    try { await api("/api/admin/tips-image", { method: "POST", body: JSON.stringify({ dataUrl }) }); toast(T("imgSaved")); loadTips(); } catch (err) { handleErr(err); }
  });
  $("tipImgRemove").addEventListener("click", async () => {
    try { await api("/api/admin/tips-image", { method: "POST", body: JSON.stringify({ remove: true }) }); toast(T("imgRemoved")); loadTips(); } catch (err) { handleErr(err); }
  });

  /* ===================== Shifts & supervisors ===================== */
  let shiftsData = null;
  const openRiders = new Set();
  const rlFilter = new Map();
  const RF = { all: () => true, present: (r, g) => r.status === "present" && !(r.late_min >= g), late: (r, g) => r.status === "present" && r.late_min >= g, absent: (r) => r.status === "absent", pending: (r) => r.status === "pending", noapp: (r) => !r.app };
  const cp = (text) => { try { return navigator.clipboard.writeText(text); } catch { return Promise.reject(); } };
  const ymd = (ms) => new Date(ms).toLocaleDateString("en-GB", { timeZone: "Asia/Riyadh", weekday: "short", day: "2-digit", month: "short" });

  // 24-hour time dropdowns (native time inputs show AM/PM on many devices)
  function fillTimes(sel, val) {
    let o = '<option value="">--:--</option>', found = !val;
    for (let m = 0; m < 1440; m += 5) {
      const t = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
      if (t === val) found = true;
      o += `<option value="${t}">${t}</option>`;
    }
    if (!found) o += `<option value="${esc(val)}">${esc(val)}</option>`;
    sel.innerHTML = o; sel.value = val || "";
  }
  async function openDiag(testRes) {
    try {
      const d = await api("/api/admin/diagnose");
      const row = (k, v) => `<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)"><span class="muted">${esc(T(k))}</span><b dir="ltr">${esc(String(v))}</b></div>`;
      const lt = d.last_tick;
      $("diagBody").innerHTML =
        (d.problems.length ? d.problems.map((x) => `<div class="card" style="padding:8px 12px;margin-bottom:8px;border-color:var(--red);background:var(--red-soft)">⚠️ ${esc(x)}</div>`).join("") : `<div class="card" style="padding:8px 12px;margin-bottom:8px;border-color:var(--green)">✅ ${esc(T("diagOk"))}</div>`) +
        row("dg_time", d.local_time + " (" + d.timezone + ")") + row("dg_riders", d.riders) + row("dg_push", d.with_push) +
        row("dg_elig", d.eligible_with_push + " / " + d.eligible_now) +
        row("dg_last", lt ? hhmm(lt.at) + (lt.ok ? "" : " ✖") : "–") + row("dg_prompt", d.last_prompt_at ? hhmm(d.last_prompt_at) : "–") +
        (testRes ? `<div style="margin-top:8px"><b>${esc(T("dg_test", { s: testRes.sent, f: testRes.failed, t: testRes.total }))}</b></div>` : "");
      if (!$("diagDlg").open) $("diagDlg").showModal();
    } catch (e) { handleErr(e); }
  }
  $("grpClose").addEventListener("click", () => $("grpDlg").close());
  $("diagBtn").addEventListener("click", () => openDiag());
  $("diagClose").addEventListener("click", () => $("diagDlg").close());
  $("diagTest").addEventListener("click", async () => {
    $("diagTest").disabled = true;
    try { openDiag(await api("/api/admin/testpush", { method: "POST", body: "{}" })); } catch (e) { handleErr(e); } finally { $("diagTest").disabled = false; }
  });
  async function loadShifts() {
    try { shiftsData = await api("/api/admin/shifts"); renderShifts(); } catch (e) { handleErr(e); }
    try { renderSchedules(await api("/api/admin/schedules")); } catch (e) { /* optional */ }
  }
  function renderSchedules(d) {
    $("schHead").innerHTML = `<th>${esc(T("schRider"))}</th>` + d.days.map((x) => `<th>${esc(x.slice(5))}</th>`).join("");
    $("schBody").innerHTML = d.riders.length
      ? d.riders.map((r) => `<tr><td class="rname">${esc(r.name || r.id)} <span class="muted">${esc(r.id)}</span></td>` +
          r.slots.map((sl) => `<td dir="ltr" style="white-space:nowrap">${sl.length ? sl.map(esc).join("<br>") : '<span class="muted">' + esc(T("schNone")) + "</span>"}</td>`).join("") + "</tr>").join("")
      : `<tr><td colspan="8" class="empty">${esc(T("noRiders"))}</td></tr>`;
  }
  function phaseOf(s, now) {
    const o = s.occ;
    if (!s.active) return { cls: "b-idle", text: T("ph_off") };
    if (!o) return { cls: "b-idle", text: T("ph_later") };
    if (o.phase === "upcoming") return { cls: "b-idle", text: T("ph_later") };
    if (o.phase === "before") return { cls: "b-declared", text: T("ph_before", { n: dur(o.startAt - now) }) };
    return { cls: "b-green", text: T("ph_running") };
  }
  function riderRow(r, grace, band, nameOf) {
    const st = r.status === "present" ? `<span class="badge b-green">${esc(T("c_present"))}</span>` : r.status === "absent" ? `<span class="badge b-late">${esc(T("c_absent"))}</span>` : `<span class="badge b-declared">${esc(T("r_notyet"))}</span>`;
    const bits = [];
    if (r.rider_at) bits.push(hhmm(r.rider_at) + (r.late_min >= grace ? " · " + T("r_late_n", { n: r.late_min }) : ""));
    if (r.by) bits.push(T(r.by === "supervisor" ? "by_sup" : "by_rider"));
    if (!r.app) bits.push(T("r_noapp")); else if (!r.push) bits.push(T("r_nopush"));
    const sel = band && band.sup_ids.length
      ? `<select class="rsup" data-rsup="${esc(r.id)}" title="${esc(T("rsupLabel"))}"><option value="">${esc(T("rsupAll"))}</option>${band.sup_ids.map((id) => `<option value="${id}"${r.sup_override === id ? " selected" : ""}>${esc(nameOf.get(id) || "?")}</option>`).join("")}</select>`
      : "";
    return `<tr><td><span class="rname">${esc(r.name || r.id)}</span> <span class="rid">#${esc(r.id)}</span></td><td>${st}</td><td class="muted">${esc(bits.join(" · "))}</td><td>${sel}</td></tr>`;
  }
  function renderShifts() {
    const d = shiftsData;
    if (!d) return;
    const now = d.now;
    const nameOf = new Map(d.supervisors.map((x) => [x.id, x.name]));
    const today = new Date(now).toLocaleDateString(lang === "ar" ? "ar-EG" : "en-GB", { timeZone: "Asia/Riyadh", weekday: "long", day: "numeric", month: "long" });
    $("shSub").textContent = T("shSub", { t: today, n: d.supervisors.filter((x) => x.active).length });
    $("shHelp").textContent = T("shHelp", { l: d.config.lead, e: d.config.nag });

    const alerts = [];
    $("shGrid").innerHTML = d.shifts.length ? d.shifts.map((s) => {
      const ph = phaseOf(s, now), c = s.counts;
      const o = s.occ;
      const running = o && o.phase === "running";
      const unconf = running && !s.confirms.length && now > o.startAt + 10 * 60000;
      if (unconf) alerts.push(T("alertNoConf", { n: s.name }));
      else if (running && c && c.pending > 0 && now > o.startAt + 15 * 60000) alerts.push(T("alertPend", { n: s.name, p: c.pending }));
      const sups = s.sup_ids.length ? s.sup_ids.map((id) => {
        const cf = s.confirms.find((x) => x.sup_id === id);
        return cf ? `<span class="badge b-green">✅ ${esc(T("sup_ok", { n: nameOf.get(id) || "?", t: hhmm(cf.at) }))}</span>` : `<span class="badge ${unconf ? "b-late" : "b-idle"}">⏳ ${esc(T("sup_wait", { n: nameOf.get(id) || "?" }))}</span>`;
      }).join("") : `<span class="muted">${esc(T("sup_none"))}</span>`;
      let body = "";
      if (c && c.total) {
        const w = (n) => (n / c.total * 100).toFixed(1) + "%";
        const ontime = c.present - c.late;
        body = `<div class="stack-bar"><i style="width:${w(ontime)};background:var(--green)"></i><i style="width:${w(c.late)};background:var(--amber)"></i><i style="width:${w(c.absent)};background:var(--red)"></i></div>
          <div class="cnts">${[["present", "sev-ok", c.present - c.late, "c_present"], ["late", "sev-mid", c.late, "c_late"], ["absent", "sev-hi", c.absent, "c_absent"], ["pending", "", c.pending, "c_pending"], ["noapp", "sev-hi", s.riders.filter((r) => !r.app).length, "c_noapp"]].map(([k, cl, n, lab]) => `<button type="button" class="cbtn${rlFilter.get(s.id) === k && openRiders.has(s.id) ? " on" : ""}" data-rf="${s.id}|${k}"><b class="${cl}">${n}</b> ${esc(T(lab))}</button>`).join("")}</div>`;
      } else {
        body = `<div class="muted">${esc(T("noShiftRiders"))}</div>`;
      }
      const isOpen = openRiders.has(s.id);
      const flt = RF[rlFilter.get(s.id) || "all"] || RF.all;
      const shown = s.riders.filter((r) => flt(r, d.grace));
      const list = isOpen && s.riders.length ? `<div class="rl"><table><tbody>${shown.length ? shown.map((r) => riderRow(r, d.grace, s, nameOf)).join("") : `<tr><td class="empty">${esc(T("noRiders"))}</td></tr>`}</tbody></table></div>` : "";
      return `<div class="card shcard${unconf ? " alert" : ""}"><header><div><h2>${esc(s.name)}</h2><div class="muted num">${esc(s.start)} – ${esc(s.end)}</div></div><span class="badge ${unconf ? "b-late" : ph.cls}">${esc(unconf ? T("ph_notconf") : ph.text)}</span></header>
        <div class="bd"><div class="sups">${sups}</div>${body}
        ${s.riders.length ? `<div><button class="btn ghost sm" data-rl="${s.id}">${esc(T("showRiders"))} (${s.riders.length}) ${isOpen ? "▴" : "▾"}</button></div>` : ""}${list}</div></div>`;
    }).join("") : `<div class="card empty">${esc(T("noShifts"))}</div>`;
    $("shGrid").querySelectorAll("[data-rf]").forEach((b) => b.addEventListener("click", () => {
      const [id, k] = b.dataset.rf.split("|"), sid = +id;
      if (openRiders.has(sid) && rlFilter.get(sid) === k) openRiders.delete(sid); else { openRiders.add(sid); rlFilter.set(sid, k); }
      renderShifts();
    }));
    $("shGrid").querySelectorAll("[data-rsup]").forEach((sel) => sel.addEventListener("change", async () => {
      try { await api("/api/admin/riders/supervisor", { method: "POST", body: JSON.stringify({ rider_id: sel.dataset.rsup, sup_id: sel.value ? +sel.value : null }) }); toast(T("rsupSaved")); loadShifts(); } catch (e) { handleErr(e); }
    }));
    $("shAlerts").innerHTML = alerts.map((a) => `<div class="card" style="padding:10px 14px;margin-bottom:8px;border-color:var(--red);background:var(--red-soft)">⚠️ ${esc(a)}</div>`).join("");
    $("shGrid").querySelectorAll("[data-rl]").forEach((b) => b.addEventListener("click", () => { const id = +b.dataset.rl; openRiders.has(id) ? openRiders.delete(id) : (openRiders.add(id), rlFilter.set(id, "all")); renderShifts(); }));

    // setup: shifts
    $("shHead").innerHTML = ["sh_col_name", "sh_col_time", "sh_col_sups", "sh_col_riders", "sh_col_active", ""].map((k) => `<th>${k ? esc(T(k)) : ""}</th>`).join("");
    $("shBody").innerHTML = d.shifts.map((s) => `<tr><td class="rname">${esc(s.name)}</td><td class="num">${esc(s.start)} – ${esc(s.end)}</td><td>${esc(s.sup_ids.map((i) => nameOf.get(i)).filter(Boolean).join(", ") || "–")}</td><td class="num">${s.rider_count}</td>
      <td><span class="badge ${s.active ? "b-green" : "b-idle"}">${esc(T(s.active ? "active" : "inactive"))}</span></td><td><button class="btn ghost sm" data-edit="${s.id}">${esc(T("edit"))}</button></td></tr>`).join("");
    $("shBody").querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openShiftDlg(d.shifts.find((x) => x.id === +b.dataset.edit))));

    // setup: supervisors
    $("supHead").innerHTML = ["sup_col_name", "sup_col_code", "sup_col_shifts", "sup_col_status", ""].map((k) => `<th>${k ? esc(T(k)) : ""}</th>`).join("");
    $("supBody").innerHTML = d.supervisors.length ? d.supervisors.map((u) => `<tr><td class="rname">${esc(u.name)}</td><td><span class="code">${esc(u.code)}</span></td>
      <td>${esc(d.shifts.filter((s) => s.sup_ids.includes(u.id)).map((s) => s.name).join(", ") || "–")}</td>
      <td><span class="badge ${u.active ? "b-green" : "b-idle"}">${esc(T(u.active ? "active" : "inactive"))}</span></td>
      <td style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost sm" data-cp="${u.id}">${esc(T("supCopy"))}</button><button class="btn ghost sm" data-rg="${u.id}">${esc(T("supRegen"))}</button><button class="btn ghost sm" data-tg="${u.id}">${esc(T(u.active ? "deactivate" : "activate"))}</button><button class="btn ghost sm" data-dl="${u.id}">${esc(T("delete"))}</button></td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">${esc(T("noSups"))}</td></tr>`;
    const sup = (b, k) => d.supervisors.find((x) => x.id === +b.dataset[k]);
    $("supBody").querySelectorAll("[data-cp]").forEach((b) => b.addEventListener("click", () => {
      const u = sup(b, "cp");
      cp(T("supInvite", { u: location.origin + "/sup?c=" + u.code, c: u.code })).then(() => toast(T("supCopied")), () => prompt("", T("supInvite", { u: location.origin + "/sup?c=" + u.code, c: u.code })));
    }));
    $("supBody").querySelectorAll("[data-rg]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm(T("supRegenQ"))) return;
      try { await api("/api/admin/supervisors/save", { method: "POST", body: JSON.stringify({ id: +b.dataset.rg, regen: true }) }); loadShifts(); } catch (e) { handleErr(e); }
    }));
    $("supBody").querySelectorAll("[data-tg]").forEach((b) => b.addEventListener("click", async () => {
      const u = sup(b, "tg");
      try { await api("/api/admin/supervisors/save", { method: "POST", body: JSON.stringify({ id: u.id, name: u.name, active: !u.active }) }); loadShifts(); } catch (e) { handleErr(e); }
    }));
    $("supBody").querySelectorAll("[data-dl]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm(T("supDeleteQ"))) return;
      try { await api("/api/admin/supervisors/save", { method: "POST", body: JSON.stringify({ id: +b.dataset.dl, delete: true }) }); loadShifts(); } catch (e) { handleErr(e); }
    }));

    // history
    $("hiHead").innerHTML = ["hi_day", "hi_shift", "hi_present", "hi_absent", "hi_conf"].map((k) => `<th>${esc(T(k))}</th>`).join("");
    const shName = new Map(d.shifts.map((s) => [s.id, s.name]));
    const confN = new Map(d.history_confirms.map((x) => [x.day + "|" + x.shift_id, x.n]));
    $("hiBody").innerHTML = d.history.length ? d.history.map((h) => `<tr><td class="num">${esc(h.day)}</td><td>${esc(shName.get(h.shift_id) || "#" + h.shift_id)}</td><td class="num">${h.present}</td><td class="num">${h.absent}</td><td class="num">${confN.get(h.day + "|" + h.shift_id) || 0}</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">${esc(T("noHist"))}</td></tr>`;
  }
  $("shRefresh").addEventListener("click", loadShifts);

  let editShiftId = 0;
  function openShiftDlg(s) {
    editShiftId = s ? s.id : 0;
    $("shDlgTitle").textContent = T(s ? "shDlgEdit" : "shDlgNew");
    $("shfName").value = s ? s.name : "";
    fillTimes($("shfStart"), s ? s.start : ""); fillTimes($("shfEnd"), s ? s.end : "");
    $("shfActive").checked = s ? s.active : true;
    $("shfDelete").classList.toggle("hidden", !s);
    $("shfErr").textContent = "";
    const ids = new Set(s ? s.sup_ids : []);
    $("shfSups").innerHTML = ((shiftsData && shiftsData.supervisors) || []).filter((u) => u.active || ids.has(u.id)).map((u) => `<label class="check"><input type="checkbox" value="${u.id}" ${ids.has(u.id) ? "checked" : ""}><span>${esc(u.name)}</span></label>`).join("") || `<div class="muted">${esc(T("noSups"))}</div>`;
    $("shiftDlg").showModal();
  }
  $("shAddBtn").addEventListener("click", () => openShiftDlg(null));
  $("shfCancel").addEventListener("click", () => $("shiftDlg").close());
  $("shiftForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const sup_ids = [...$("shfSups").querySelectorAll("input:checked")].map((i) => +i.value);
    if (!$("shfName").value.trim() || !$("shfStart").value || !$("shfEnd").value || $("shfStart").value === $("shfEnd").value) { $("shfErr").textContent = T("shBad"); return; }
    try {
      await api("/api/admin/shifts/save", { method: "POST", body: JSON.stringify({ id: editShiftId, name: $("shfName").value, start: $("shfStart").value, end: $("shfEnd").value, active: $("shfActive").checked, sup_ids }) });
      $("shiftDlg").close(); toast(T("shSaved")); loadShifts();
    } catch (err) { if (err.code === "key" || err.code === "missing") { $("shiftDlg").close(); handleErr(err); } else $("shfErr").textContent = err.message; }
  });
  $("shfDelete").addEventListener("click", async () => {
    if (!confirm(T("shDeleteQ"))) return;
    try { await api("/api/admin/shifts/save", { method: "POST", body: JSON.stringify({ id: editShiftId, delete: true }) }); $("shiftDlg").close(); loadShifts(); } catch (e) { handleErr(e); }
  });
  $("supForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("supName").value.trim();
    if (!name) return;
    try { await api("/api/admin/supervisors/save", { method: "POST", body: JSON.stringify({ name }) }); $("supName").value = ""; loadShifts(); } catch (err) { handleErr(err); }
  });

  /* ===================== Incentives editor ===================== */
  let incData = null, incLang = "en";
  const incDraft = {};
  const tableToText = (t) => (t && t.head ? [t.head, ...t.rows].map((r) => r.join(" | ")).join("\n") : "");
  const textToTable = (txt) => {
    const rows = String(txt || "").split(/\r?\n/).map((l) => l.split("|").map((x) => x.trim())).filter((r) => r.some(Boolean));
    return rows.length >= 2 ? { head: rows[0], rows: rows.slice(1) } : null;
  };
  const lines = (txt) => String(txt || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);

  async function loadInc() {
    try { incData = await api("/api/admin/incentives"); Object.keys(incDraft).forEach((k) => delete incDraft[k]); renderInc(); } catch (e) { handleErr(e); }
  }
  function collectInc() {
    if (!incData) return;
    const boxes = [...$("incList").querySelectorAll(".icard")];
    if (!boxes.length && !$("incList").dataset.has) return;
    incDraft[incLang] = boxes.map((b) => {
      const g = (k) => b.querySelector(`[data-f="${k}"]`).value;
      return { icon: g("icon"), color: g("color"), title: g("title"), intro: g("intro"), lines: lines(g("lines")), formulas: lines(g("formulas")), table: textToTable(g("table")), note: g("note") };
    });
  }
  function renderInc() {
    if (!incData) return;
    $("incLangs").innerHTML = ["en", "ar", "ur", "bn"].map((l) => `<button class="chip" data-l="${l}" aria-pressed="${l === incLang}">${{ en: "English", ar: "العربية", ur: "اردو", bn: "বাংলা" }[l]}</button>`).join("");
    $("incLangs").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { collectInc(); incLang = b.dataset.l; renderInc(); }));
    $("incCustom").classList.toggle("hidden", !incData.custom[incLang]);
    $("incCopyEn").classList.toggle("hidden", incLang === "en");
    const cards = incDraft[incLang] || (incDraft[incLang] = JSON.parse(JSON.stringify(incData.cards[incLang] || [])));
    const rtl = incLang === "ar" || incLang === "ur";
    $("incList").dataset.has = "1";
    $("incList").innerHTML = cards.length ? cards.map((c, i) => `<div class="card icard" data-ix="${i}">
      <div class="top"><h2>${esc(T("cardN", { n: i + 1 }))}</h2><div style="display:flex;gap:6px"><button class="btn ghost sm" data-a="up">▲ ${esc(T("up"))}</button><button class="btn ghost sm" data-a="down">▼ ${esc(T("down"))}</button><button class="btn ghost sm" data-a="del">${esc(T("delCard"))}</button></div></div>
      <div class="two"><label><span>${esc(T("fi_icon"))}</span><input data-f="icon" value="${esc(c.icon)}" maxlength="8" style="text-align:center"></label><label><span>${esc(T("fi_color"))}</span><input data-f="color" type="color" value="${esc(/^#[0-9a-fA-F]{6}$/.test(c.color || "") ? c.color : "#f59e0b")}"></label><label><span>${esc(T("fi_title"))}</span><input data-f="title" dir="${rtl ? "rtl" : "ltr"}" value="${esc(c.title)}"></label></div>
      <label><span>${esc(T("fi_intro"))}</span><textarea data-f="intro" rows="2" dir="${rtl ? "rtl" : "ltr"}">${esc(c.intro)}</textarea></label>
      <label><span>${esc(T("fi_lines"))}</span><textarea data-f="lines" rows="4" dir="${rtl ? "rtl" : "ltr"}">${esc((c.lines || []).join("\n"))}</textarea></label>
      <label><span>${esc(T("fi_formulas"))}</span><textarea data-f="formulas" rows="3" dir="${rtl ? "rtl" : "ltr"}">${esc((c.formulas || []).join("\n"))}</textarea></label>
      <label><span>${esc(T("fi_table"))}</span><textarea data-f="table" class="mono" rows="6" dir="${rtl ? "rtl" : "ltr"}">${esc(tableToText(c.table))}</textarea></label>
      <label><span>${esc(T("fi_note"))}</span><input data-f="note" dir="${rtl ? "rtl" : "ltr"}" value="${esc(c.note)}"></label></div>`).join("")
      : `<div class="card empty" style="margin-bottom:14px">${esc(T("incEmpty"))}</div>`;
    $("incList").querySelectorAll(".icard [data-a]").forEach((b) => b.addEventListener("click", () => {
      collectInc();
      const arr = incDraft[incLang], i = +b.closest(".icard").dataset.ix;
      if (b.dataset.a === "del") { if (!confirm(T("delCardQ"))) return; arr.splice(i, 1); }
      else if (b.dataset.a === "up" && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
      else if (b.dataset.a === "down" && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
      renderInc();
    }));
  }
  $("incAddCard").addEventListener("click", () => { collectInc(); (incDraft[incLang] = incDraft[incLang] || []).push({ icon: "🎁", color: "#f59e0b", title: "", intro: "", lines: [], formulas: [], table: null, note: "" }); renderInc(); });
  $("incCopyEn").addEventListener("click", () => {
    if (!confirm(T("incCopyQ"))) return;
    incDraft[incLang] = JSON.parse(JSON.stringify(incData.cards.en || [])); renderInc();
  });
  $("incSave").addEventListener("click", async () => {
    collectInc();
    try { await api("/api/admin/incentives", { method: "POST", body: JSON.stringify({ lang: incLang, cards: incDraft[incLang] || [] }) }); toast(T("incSaved")); await loadInc(); } catch (e) { handleErr(e); }
  });
  $("incReset").addEventListener("click", async () => {
    if (!confirm(T("incResetQ"))) return;
    try { await api("/api/admin/incentives", { method: "POST", body: JSON.stringify({ lang: incLang, reset: true }) }); toast(T("incResetDone")); await loadInc(); } catch (e) { handleErr(e); }
  });

  let timer = null;
  function startPolling() {
    stopPolling();
    timer = setInterval(() => { if (document.hidden) return; if (page === "live") loadLive(); else if (page === "shifts") loadShifts(); }, 15000);
  }
  function stopPolling() { clearInterval(timer); timer = null; }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").classList.contains("hidden")) { if (page === "live") loadLive(); else if (page === "shifts") loadShifts(); } });

  function renderAll() {
    renderRanges();
    if (overview) renderLive();
    if (report) renderReport();
    if (manage) renderRidersMgmt();
    if (shiftsData) renderShifts();
    if (incData) { collectInc(); renderInc(); }
    renderPerfTabs();
    if (perfList && perfTab === "data") { renderPerfData(); loadPerfData(true); }
    if (tipsData && perfTab === "tips") renderTips();
    if (perfRows) updTgt();
  }

  applyStatic();
  if (key) showApp(); else showGate();
  </script>
</body>
</html>
